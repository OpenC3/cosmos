# Define root directories for sources and tests
sonar.sources = openc3/lib/,openc3/python/openc3/
sonar.tests = openc3/spec/,openc3/python/test

# Release-time developer scripts run locally on a maintainer's workstation.
# All inputs come from files on disk and the maintainer's own prompts, so
# path traversal / command injection findings from these files are not
# applicable. Exclude them from security hotspot analysis.
sonar.security.exclusions = scripts/release/**/*.rb

# The screen BUTTON widget sandbox (sandbox.html + buttonScriptSandbox.js) is a
# deliberate JavaScript isolation control: it executes author-supplied button
# JavaScript with eval inside an opaque-origin iframe whose CSP is precisely what
# permits that eval. These findings ARE the design and were reviewed as safe -
# the sandboxed frame has no session token, no cookies, no parent DOM, and (via
# default-src 'none') no network egress - so the eval, permissive-CSP, and
# opaque-origin postMessage rules are ignored for these two files only.
sonar.issue.ignore.multicriteria = sandboxEval,sandboxCsp,sandboxPostMessage,templateNoLock,templateNoJsLock,baseTagApis,baseTagOpenc3,baseTagOperator,baseTagInit,baseTagNodeUbi

# eval of author button code inside the jailed frame (the sandbox's whole purpose)
sonar.issue.ignore.multicriteria.sandboxEval.ruleKey = javascript:S1523
sonar.issue.ignore.multicriteria.sandboxEval.resourceKey = **/openc3-tool-base/public/sandbox.html

# CSP must allow 'unsafe-eval'/'unsafe-inline' *inside* the opaque frame so that
# eval can run; network egress is still fully blocked by default-src 'none'
sonar.issue.ignore.multicriteria.sandboxCsp.ruleKey = Web:S7039
sonar.issue.ignore.multicriteria.sandboxCsp.resourceKey = **/openc3-tool-base/public/sandbox.html

# postMessage to a sandboxed (opaque-origin) frame must use '*' as targetOrigin;
# the message is delivered only to our own contentWindow and never carries the token
sonar.issue.ignore.multicriteria.sandboxPostMessage.ruleKey = javascript:S2819
sonar.issue.ignore.multicriteria.sandboxPostMessage.resourceKey = **/openc3-vue-common/src/util/buttonScriptSandbox.js

# openc3/templates/plugin/pyproject.toml is a scaffolding template rendered by
# 'openc3.sh cli generate plugin --python' at an arbitrary future date, not a
# project that is itself installed. Committing a uv.lock beside it would pin
# every plugin generated from then on to whatever versions were current when the
# template was written - the opposite of what the rule is protecting. Generated
# plugins still satisfy the rule: the template tells the author to run 'uv lock'
# and commit the result, and COSMOS installs a locked plugin with
# 'uv sync --frozen'.
sonar.issue.ignore.multicriteria.templateNoLock.ruleKey = text:S8565
sonar.issue.ignore.multicriteria.templateNoLock.resourceKey = openc3/templates/plugin/pyproject.toml

# The same for the JavaScript plugin templates (openc3/templates/*/package.json,
# rendered by 'openc3.sh cli generate'): a lock file committed beside them
# would pin every generated plugin to today's versions. The generated plugin
# gets its own lock file from its first 'pnpm install'.
sonar.issue.ignore.multicriteria.templateNoJsLock.ruleKey = text:S8564
sonar.issue.ignore.multicriteria.templateNoJsLock.resourceKey = openc3/templates/**/package.json

# These Dockerfiles build FROM our own images (openc3-ruby, openc3-base,
# openc3-node) with ARG OPENC3_TAG=latest as the default. Every build passes
# OPENC3_TAG explicitly (compose-build.yaml from .env, the release and UBI build
# scripts), so 'latest' only names the image just built in the same chain, not
# a mutable third-party tag. openc3-node/Dockerfile is not listed because it
# also builds FROM the external node image, which must stay pinned.
sonar.issue.ignore.multicriteria.baseTagApis.ruleKey = docker:S6596
sonar.issue.ignore.multicriteria.baseTagApis.resourceKey = openc3-cosmos-*-api/Dockerfile
sonar.issue.ignore.multicriteria.baseTagOpenc3.ruleKey = docker:S6596
sonar.issue.ignore.multicriteria.baseTagOpenc3.resourceKey = openc3/Dockerfile
sonar.issue.ignore.multicriteria.baseTagOperator.ruleKey = docker:S6596
sonar.issue.ignore.multicriteria.baseTagOperator.resourceKey = openc3-operator/Dockerfile
sonar.issue.ignore.multicriteria.baseTagInit.ruleKey = docker:S6596
sonar.issue.ignore.multicriteria.baseTagInit.resourceKey = openc3-cosmos-init/Dockerfile
sonar.issue.ignore.multicriteria.baseTagNodeUbi.ruleKey = docker:S6596
sonar.issue.ignore.multicriteria.baseTagNodeUbi.resourceKey = openc3-node/Dockerfile-ubi
