packages:
  - 'packages/*'

strictDepBuilds: false

minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeExclude:
  # we control these packages
  - ace-diff
  - '@openc3/js-common'
  - '@openc3/vue-common'
  - '@openc3/tool-base'

# pnpm 11 defaults strictDepBuilds to true, which turns "ignored build scripts"
# from a warning into an install failure. Note pnpm 11 replaced
# onlyBuiltDependencies with allowBuilds.
#
# None of these need their build script:
#   @parcel/watcher - postinstall only builds from source (node-gyp) when no
#                     prebuild matches; the platform optional deps ship one
#   esbuild         - postinstall only validates/downloads the binary that the
#                     platform optional deps already provide
#   vue-demi        - postinstall swaps lib/ between the Vue 2 and Vue 3 build;
#                     the published default is already Vue 3, which is all we use
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  vue-demi: false

# Force patched versions of transitive dependencies flagged by Dependabot.
# Remove an entry once the parent package (shown in the comment) ships a fixed
# version on its own.
overrides:
  dompurify@<3.4.17: 3.4.17 # monaco-editor pins 3.4.15
  follow-redirects@<1.16.2: ^1.16.2 # axios
