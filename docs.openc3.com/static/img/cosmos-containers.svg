  <text class="desc" x="36" y="194">Rails application: script APIs</text>
  <text class="desc" x="36" y="211">WebSockets (AnyCable)</text>
  <rect class="card" x="258" y="132" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#1d4ed8" transform="translate(272,146) scale(1.0833)"><ellipse cx="12" cy="5" rx="9" ry="2.5"/><path d="M3 5l2.2 14.5c.2 1.4 3.2 2.5 6.8 2.5s6.6-1.1 6.8-2.5L21 5"/><path d="M7 11c3 1 7 1 10 0"/></g>
  <text class="name" x="308" y="164">Buckets</text>
  <text class="desc" x="274" y="194">Bucket storage</text>
  <text class="desc" x="274" y="211">Static webserver for tools</text>
  <rect class="card" x="496" y="132" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#1d4ed8" transform="translate(510,146) scale(1.0833)"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text class="name" x="546" y="164">Redis</text>
  <text class="desc" x="512" y="194">Configuration and models</text>
  <text class="desc" x="512" y="211">Current Value Table</text>
  <rect class="card" x="734" y="132" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#1d4ed8" transform="translate(748,146) scale(1.0833)"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text class="name" x="784" y="164">Redis Ephemeral</text>
  <text class="desc" x="750" y="194">Cmd / Tlm streams</text>
