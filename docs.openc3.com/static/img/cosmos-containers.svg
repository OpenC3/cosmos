  <g class="icon" stroke="#1d4ed8" transform="translate(34,258) scale(1.0833)"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text class="name" x="70" y="276">TSDB</text>
  <text class="desc" x="36" y="306">Time series database</text>
  <text class="desc" x="36" y="323">Decommutated data</text>
  <rect class="card-ent" x="258" y="244" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#047857" transform="translate(272,258) scale(1.0833)"><path d="M3 3v18h18"/><path d="M6.5 15l4-5 3.5 3 5-7"/></g>
  <text class="name" x="308" y="276">Grafana</text>
  <text class="desc" x="274" y="306">Data visualization</text>
  <rect class="card-ent" x="496" y="244" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#047857" transform="translate(510,258) scale(1.0833)"><path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4-6"/><circle cx="12" cy="17" r="1.2"/><path d="M3 20.5h18"/></g>
  <text class="name" x="546" y="276">Metrics</text>
  <text class="desc" x="512" y="306">Prometheus endpoint</text>
  <rect class="card-ent" x="734" y="244" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#047857" transform="translate(748,258) scale(1.0833)"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16 7l3 3M14 9l2 2"/></g>
  <text class="name" x="784" y="276">Keycloak</text>
  <text class="desc" x="750" y="306">Single Sign-On</text>
  <text class="desc" x="750" y="323">Manages RBAC</text>
  <rect class="card-ent" x="20" y="356" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#047857" transform="translate(34,370) scale(1.0833)"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text class="name" x="70" y="388">PostgreSQL</text>
  <text class="desc" x="36" y="418">Database for Keycloak</text>
  <rect class="card-ent" x="258" y="356" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#047857" transform="translate(272,370) scale(1.0833)"><path d="M3 6.5a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/></g>
  <text class="name" x="308" y="388">NFS</text>
  <text class="desc" x="274" y="418">Kubernetes only: shared</text>
  <text class="desc" x="274" y="435">storage for code libraries</text>
  <rect x="496" y="356" width="460" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="tab" x="512" y="382">KEY</text>
