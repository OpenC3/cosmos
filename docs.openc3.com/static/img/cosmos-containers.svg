  <g class="icon" stroke="#1d4ed8" transform="translate(34,146) scale(1.0833)"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M9 9l-3 3 3 3M15 9l3 3-3 3M13 8.5l-2 7"/></g>
