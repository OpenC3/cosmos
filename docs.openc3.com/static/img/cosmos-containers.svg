<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 472" width="968" height="472" role="img" aria-labelledby="title desc">
  <title id="title">COSMOS containers</title>
  <desc id="desc">The running COSMOS containers. Core and Enterprise: init, traefik, operator, cmd-tlm-api, script-runner-api, buckets, redis, redis-ephemeral, and tsdb. Enterprise only: grafana, metrics, keycloak, postgresql, and NFS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1e293b; }
      .card { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
      .card-ent { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
      .actor { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .name { font-size: 14px; font-weight: 600; }
      .sub { font-size: 12px; fill: #475569; }
      .desc { font-size: 12px; fill: #334155; }
      .group-core { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
      .group { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .group-k8s { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .tab { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .link { fill: none; stroke: #475569; stroke-width: 1.75; }
      .uses { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .label { font-size: 12px; fill: #334155; }
      .icon { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .layer-ent { fill: #ecfdf5; stroke: #047857; stroke-width: 1.25; }
      .layer-core { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.25; }
      .layer-oss { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.25; }
      .layer-text { font-size: 12px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="968" height="472" rx="12" fill="#ffffff"/>

  <rect class="card" x="20" y="20" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#1d4ed8" transform="translate(34,34) scale(1.0833)"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M6.5 9.5l3 2.5-3 2.5"/><path d="M12 15h5"/></g>
  <text class="name" x="70" y="52">Init</text>
  <text class="desc" x="36" y="82">Runs migrations</text>
  <text class="desc" x="36" y="99">Installs the COSMOS tools</text>
  <rect class="card" x="258" y="20" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#1d4ed8" transform="translate(272,34) scale(1.0833)"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="12" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7.5 12h9M7.2 10.8l9.5-5M7.2 13.2l9.5 5"/></g>
  <text class="name" x="308" y="52">Traefik</text>
  <text class="desc" x="274" y="82">Reverse proxy to all</text>
  <text class="desc" x="274" y="99">routes and services</text>
  <rect class="card" x="496" y="20" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#1d4ed8" transform="translate(510,34) scale(1.0833)"><rect x="3" y="3.5" width="18" height="7" rx="1.5"/><rect x="3" y="13.5" width="18" height="7" rx="1.5"/><path d="M7 7h.01M7 17h.01"/><path d="M11 7h6M11 17h6"/></g>
  <text class="name" x="546" y="52">Operator</text>
  <text class="desc" x="512" y="82">Runs microservices</text>
  <text class="desc" x="512" y="99">In Kubernetes: spawns pods</text>
  <rect class="card" x="734" y="20" width="222" height="96" rx="8"/>
  <g class="icon" stroke="#1d4ed8" transform="translate(748,34) scale(1.0833)"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M9 9l-3 3 3 3M15 9l3 3-3 3M13 8.5l-2 7"/></g>
