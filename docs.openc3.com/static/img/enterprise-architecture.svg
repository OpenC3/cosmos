<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title desc">
  <title id="title">COSMOS Enterprise architecture</title>
  <desc id="desc">COSMOS Enterprise deployed on a Kubernetes cluster with Helm. The openc3-nfs chart deploys shared NFS storage. The openc3 chart deploys traefik, init, operator, cmd-tlm-api, script-runner-api, and the Enterprise-only grafana, metrics, and keycloak services. The openc3-db chart deploys tsdb, buckets, redis, redis-ephemeral, and the Enterprise-only postgresql database used by keycloak.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1e293b; }
      .card { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
      .card-ent { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
      .actor { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .name { font-size: 14px; font-weight: 600; }
      .sub { font-size: 12px; fill: #475569; }
      .desc { font-size: 12px; fill: #334155; }
      .group-core { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
      .group { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .group-k8s { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .tab { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .link { fill: none; stroke: #475569; stroke-width: 1.75; }
      .uses { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .label { font-size: 12px; fill: #334155; }
      .icon { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .layer-ent { fill: #ecfdf5; stroke: #047857; stroke-width: 1.25; }
      .layer-core { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.25; }
      .layer-oss { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.25; }
      .layer-text { font-size: 12px; text-anchor: middle; }
    </style>
  </defs>

