<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1030" width="960" height="1030" role="img" aria-labelledby="title desc">
  <title id="title">COSMOS Enterprise architecture</title>
  <desc id="desc">COSMOS Enterprise deployed on a Kubernetes cluster with Helm. The openc3-nfs chart deploys shared NFS storage. The openc3 chart deploys traefik, init, operator, cmd-tlm-api, script-runner-api, and the Enterprise-only grafana, metrics, and keycloak services. The openc3-db chart deploys tsdb, buckets, redis, redis-ephemeral, and the Enterprise-only postgresql database used by keycloak; tsdb, redis, and redis-ephemeral run one instance per database shard. With operator shards set to 0, the operator creates a separate pod for each interface, target, and plugin microservice. With operator shards set to N, N operator pods each run the microservices assigned to their shard as processes. Interfaces connect to targets outside the cluster.</desc>
