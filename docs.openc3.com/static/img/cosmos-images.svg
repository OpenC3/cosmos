<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="1140" height="500" role="img" aria-labelledby="title desc">
  <title id="title">COSMOS container images</title>
  <desc id="desc">COSMOS Core and Enterprise container images built from the bottom up. openc3-ruby builds on Debian trixie-slim or UBI9 minimal. openc3-node and openc3-base build on openc3-ruby. The init, operator, cmd-tlm-api, and script-runner-api images build on openc3-base, and Enterprise images build on those using openc3-enterprise-gem. The buckets, redis, traefik, and tsdb images build on open source images, and Enterprise extends them. Grafana, keycloak, and postgresql are Enterprise images built directly on open source images.</desc>
