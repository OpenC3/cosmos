      .card-ent { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
      .actor { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .name { font-size: 14px; font-weight: 600; }
      .sub { font-size: 12px; fill: #475569; }
      .desc { font-size: 12px; fill: #334155; }
      .group-core { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
      .group { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .group-k8s { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .tab { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .link { fill: none; stroke: #475569; stroke-width: 1.75; }
      .uses { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .label { font-size: 12px; fill: #334155; }
      .icon { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .layer-ent { fill: #ecfdf5; stroke: #047857; stroke-width: 1.25; }
      .layer-core { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.25; }
      .layer-oss { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.25; }
      .layer-text { font-size: 12px; text-anchor: middle; }
    </style>
