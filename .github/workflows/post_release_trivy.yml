name: Post Release Trivy Scan

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
  release:
    types: [published]

# Workaround for https://github.com/aquasecurity/trivy-action/issues/389
env:
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

permissions:
  contents: read

jobs:
  openc3-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write permission to upload release asset
    env:
      # workflow_dispatch passes a bare version (6.10.0), the release event
      # passes a tag (v6.10.0). Normalized to a bare version by the step below.
      RAW_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Expressions have no string replace, so strip the leading "v" in shell.
      - name: Determine version
        run: |
          version="${RAW_VERSION#v}"
          if [ -z "$version" ]; then
            echo "Could not determine the release version to scan" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify release exists
        id: check_release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            // Fail fast rather than scanning every image and only discovering
            // at upload time that there is no release to attach the results to.
            await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            console.log("found release for tag", tag);
      - name: Manual Trivy Setup
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          cache: true
          version: v0.74.0
      - name: Create trivy output folder
        run: mkdir trivy_results
      - name: Create sbom folder
        run: mkdir sbom
      # The UBI results go in their own folders so they zip into their own
      # release attachments: the UBI images are a separate distribution and
      # are asked for separately, so mixing them into the Debian report would
      # make either one harder to hand over.
      - name: Create UBI trivy output and sbom folders
        run: mkdir trivy_results_ubi sbom_ubi
      - name: Get current date
        id: date
        run: echo "date=$(date -u '+%m_%d_%y_%H_%M_%S')" >> "$GITHUB_OUTPUT"
      - name: Run Trivy on image ruby
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-ruby:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-ruby.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image ruby in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-ruby:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-ruby.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image node
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-node:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-node.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image node in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-node:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-node.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image base
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-base:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-base.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image base in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-base:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-base.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image cosmos-init
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-cosmos-init:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-cosmos-init.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image cosmos-init in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-cosmos-init:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-cosmos-init.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image redis
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-redis:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-redis.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image redis in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-redis:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-redis.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image bucket
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-buckets:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-buckets.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image bucket in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-buckets:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-buckets.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image tsdb
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-tsdb:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-tsdb.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image tsdb in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-tsdb:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-tsdb.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image operator
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-operator:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-operator.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image operator in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-operator:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-operator.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image cmd-tlm-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-cosmos-cmd-tlm-api:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-cosmos-cmd-tlm-api.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image cosmos-cmd-tlm-api in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-cosmos-cmd-tlm-api:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-cosmos-cmd-tlm-api.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image script-runner-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-cosmos-script-runner-api:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-cosmos-script-runner-api.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image cosmos-script-runner-api in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-cosmos-script-runner-api:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-cosmos-script-runner-api.sbom.json"
          skip-setup-trivy: true
      - name: Run Trivy on image traefik
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-traefik:${{ env.VERSION }}"
          format: "json"
          output: "trivy_results/openc3-traefik.json"
          vuln-type: "os,library"
          scanners: "vuln"
          skip-setup-trivy: true
      - name: Run Trivy on image traefik in SBOM mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: "docker.io/openc3inc/openc3-traefik:${{ env.VERSION }}"
          format: "cyclonedx"
          output: "sbom/openc3-traefik.sbom.json"
          skip-setup-trivy: true
      # scripts/release/build_multi_arch.sh ubi publishes these alongside the
      # Debian images, so they can be scanned straight from Docker Hub. One
      # loop rather than 22 more copies of the step above: the trivy-action
      # only shells out to the same binary "Manual Trivy Setup" installed.
      #
      # continue-on-error because the release attachments are uploaded at the
      # end of this job: a UBI image that failed to publish must not take the
      # Debian report down with it. The loop records a failure and keeps going
      # so one bad image does not hide the other ten.
      - name: Run Trivy on the UBI images
        continue-on-error: true
        env:
          UBI_IMAGES: >-
            openc3-ruby-ubi
            openc3-base-ubi
            openc3-node-ubi
            openc3-buckets-ubi
            openc3-redis-ubi
            openc3-tsdb-ubi
            openc3-cosmos-cmd-tlm-api-ubi
            openc3-cosmos-script-runner-api-ubi
            openc3-operator-ubi
            openc3-traefik-ubi
            openc3-cosmos-init-ubi
        run: |
          status=0
          for image in $UBI_IMAGES; do
            ref="docker.io/openc3inc/${image}:${VERSION}"
            echo "::group::trivy ${image}"
            trivy image --image-src remote --exit-code 0 \
              --pkg-types os,library --scanners vuln \
              --format json --output "trivy_results_ubi/${image}.json" \
              "$ref" || status=1
            trivy image --image-src remote --exit-code 0 \
              --format cyclonedx --output "sbom_ubi/${image}.sbom.json" \
              "$ref" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Create zip of trivy results
        run: zip -r trivy_results.zip trivy_results
      - name: Create zip of SBOM results
        run: zip -r sbom.zip sbom
      - name: Create zip of UBI trivy results
        run: zip -r trivy_results_ubi.zip trivy_results_ubi
      - name: Create zip of UBI SBOM results
        run: zip -r sbom_ubi.zip sbom_ubi
      - name: Upload release attachments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DATE: ${{ steps.date.outputs.date }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const date = process.env.DATE;
            const tag = `v${version}`;
            // const tag = context.ref.replace("refs/tags/", "");
            console.log("tag = ", tag);
            // Get release for this tag
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            // Upload the release asset
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: `${date}_trivy_results_v${version}.zip`,
              data: await fs.readFileSync("trivy_results.zip")
            });
            // Upload the release asset
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: `${date}_sbom_v${version}.zip`,
              data: await fs.readFileSync("sbom.zip")
            });
            // Upload the UBI release assets, kept separate from the Debian
            // results above so each distribution can be handed over on its own
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: `${date}_trivy_results_ubi_v${version}.zip`,
              data: await fs.readFileSync("trivy_results_ubi.zip")
            });
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: `${date}_sbom_ubi_v${version}.zip`,
              data: await fs.readFileSync("sbom_ubi.zip")
            });
