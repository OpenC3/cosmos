name: Python Lint

on:
  pull_request:
    branches-ignore:
      - "dependabot/**"
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "openc3/python/**/*.py"
      - "openc3-cosmos-script-runner-api/scripts/**/*.py"
      - "openc3-cosmos-script-runner-api/test/**/*.py"
      - "openc3/python/pyproject.toml"
      - "openc3/python/uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ruff parses files and never imports them, so this job has no use for
      # openc3 being installed. Skipping that editable install is what lets
      # --no-build apply, keeping any third-party build backend from executing.
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          no-install-project: "true"
          no-build: "true"
      - name: Run ruff check on openc3/python
        run: uv run --frozen --no-build ruff check --output-format=github openc3
        working-directory: openc3/python
      - name: Run ruff format check on openc3/python
        run: uv run --frozen --no-build ruff format --check openc3
        working-directory: openc3/python
      - name: Run ruff check on script-runner-api scripts
        run: uv run --frozen --no-build ruff check --output-format=github ../../openc3-cosmos-script-runner-api/scripts
        working-directory: openc3/python
      - name: Run ruff format check on script-runner-api scripts
        run: uv run --frozen --no-build ruff format --check ../../openc3-cosmos-script-runner-api/scripts
        working-directory: openc3/python
