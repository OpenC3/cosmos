name: Trivy Scan

# Runs either from the Actions tab (workflow_dispatch, any branch) or by
# commenting "/trivy" on a pull request. The comment path is how dependency
# bump PRs get scanned without path-filtering every manifest in the repo.
#
# GitHub always runs an issue_comment workflow from the DEFAULT BRANCH with
# github.ref pointing at it, so this file's comment trigger only takes effect
# once it is merged to main, and every step below has to target the PR head
# SHA resolved at runtime rather than github.sha.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

# issue_comment runs all share github.ref (the default branch), so key the
# group on the PR number instead or a /trivy on PR B would cancel PR A.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

# Workaround for https://github.com/aquasecurity/trivy-action/issues/389
env:
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

permissions:
  contents: read

jobs:
  # Privileged half. Deliberately runs no PR-controlled code: it only works
  # out which commit to scan and posts the Trivy Scan status. Splitting this
  # from the build is what keeps the /trivy gate below a defence in depth
  # rather than the only thing standing between a PR and a writable token.
  authorize:
    runs-on: ubuntu-latest
    # issue_comment fires on every issue and PR comment in the repo, so filter
    # to PR comments that actually say /trivy, from someone who already has
    # push access. This stops drive-by CI burn. It is NOT load bearing for
    # token safety: a PR can be pushed to between the comment and this job
    # starting, so the scan job below assumes the code it builds is hostile.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/trivy') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: read # read the PR head SHA
      statuses: write # post the Trivy Scan check onto the scanned commit
      issues: write # react to the triggering comment
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve the commit to scan
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # Not interpolated into the script body: issue.number is an integer,
          # but comment.body is attacker controlled and never touches the shell.
          PR_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -q .head.sha)
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Scanning $sha"

      - name: Acknowledge the comment
        if: ${{ github.event_name == 'issue_comment' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api --silent -X POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes

      # Posted before the build so a PR on this commit shows a pending Trivy
      # Scan row for the ~20 minutes this takes rather than nothing at all.
      # Dispatch runs post too: they are always aimed at a PR branch, so the
      # status lands on that PR the same way the comment path does.
      - name: Mark the check pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="Trivy Scan" \
            -f description="Building images and scanning" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # Unprivileged half. `docker compose build` runs the checked-out tree's
  # Dockerfiles and scripts, so this job executes PR-controlled code by
  # design. It therefore gets a read-only token and nothing that can write to
  # the repo or its packages. Someone pushing to the PR between the /trivy
  # comment and this job starting (CodeQL actions/untrusted-checkout-toctou)
  # then gains nothing: there is no privilege here to race for.
  scan:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the GHCR build cache; this job must never push it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Immutable SHA resolved by authorize, never a mutable branch name.
          # build-cosmos also keys its cache off `git ls-tree HEAD`, so this
          # has to be the PR head rather than the default branch.
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-cosmos
        with:
          tag: ${{ needs.authorize.outputs.sha }}
          # Never publish cache entries built from unreviewed code: main pulls
          # these images by content hash, so a PR that could write them could
          # poison every later build. The other workflows on this PR populate
          # the same hashes anyway, so this costs no build time.
          push-cache: false
      - name: Manual Trivy Setup
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          cache: true
          version: v0.69.3
      - name: Run Trivy on image ruby
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # See https://github.com/aquasecurity/trivy-action
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-ruby:${{ needs.authorize.outputs.sha }}"
          # output: "trivy-ruby.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # NOTE: Disabling upload of SARIF files so we can see the output in the job
      # like with COSMOS Enterprise. To re-enable, uncomment the Upload lines,
      # and output: "trivy-ruby.sarif" as well as setting format: "sarif" in trivy.yaml.
      #
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-ruby"
      #     sarif_file: "trivy-ruby.sarif"
      - name: Run Trivy on image node
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
