name: Trivy Scan

# Runs on every pull request, on pushes to main, and from the Actions tab.
# Deliberately unfiltered by path: the point of scanning a pull request is to
# catch vulnerable dependencies, and those arrive through manifests scattered
# across the whole repo (Gemfile.lock, uv.lock, package.json, every
# Dockerfile), so a path filter would silently skip the bump PRs that matter
# most. The GHCR build cache in .github/actions/build-cosmos is what makes
# that affordable: an unrelated PR pulls all 11 images instead of building.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Workaround for https://github.com/aquasecurity/trivy-action/issues/389
# Trivy tries each comma-separated repository in order, so a rate limit on one
# (e.g. public.ecr.aws "TOOMANYREQUESTS: Data limit exceeded") falls through.
env:
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
  # The Fetch VEX Hub step puts the VEX hub in the trivy cache; trivy's own
  # fetch goes through the GitHub API and fails (see fetch-vexhub/action.yml).
  TRIVY_SKIP_VEX_REPO_UPDATE: "true"
  # Where Fetch VEX Hub writes and the DB cache below restores to. Set so the
  # trivy CLI reads the same place.
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

permissions:
  contents: read

jobs:
  openc3-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push the GHCR build cache
      checks: write # required to post the Trivy Scan Results check run
      id-token: write # required for Docker Hub OIDC login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Authenticate Docker Hub pulls via OIDC to avoid anonymous rate limits.
      # Fork PRs get no id-token, so let them fall back to anonymous pulls.
      - name: Docker login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 49349db4-6ea2-468a-9d7a-5133cbbc5326
          DOCKERHUB_OIDC_EXPIREIN: 3600 # token defaults to 5 min; long builds pull from Docker Hub later
        with:
          username: openc3inc
      - id: build
        uses: ./.github/actions/build-cosmos
        with:
          tag: ${{ github.sha }}
      # Installs the trivy binary the scan step below calls directly. The
      # trivy release is pinned in that action.
      - name: Manual Trivy Setup
        uses: ./.github/actions/setup-trivy
      # Cache only the vulnerability DBs, not all of .cache/trivy: restoring
      # the whole directory would overwrite the VEX Hub checkout with whatever
      # was cached and save that back, so a VEX Hub pin bump would never take
      # effect. Restored before the VEX Hub is fetched. Keyed by day.
      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Trivy DB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cache/trivy/db
            ${{ github.workspace }}/.cache/trivy/java-db
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-
      - name: Fetch VEX Hub
        uses: ./.github/actions/fetch-vexhub
      # Findings do not fail this job: they are posted as a neutral (gray)
      # "Trivy Scan Results" check run, listed in the job summary, and emitted
      # as warnings. Most come from upstream base images a PR cannot fix, and
      # a red check on every PR hides which ones are actually broken. A build
      # failure above still fails the job.
      #
      # To bring back SARIF upload to code scanning, set format: "sarif" in
      # trivy.yaml and upload each image's output with
      # github/codeql-action/upload-sarif, passing that image's report path
      # and a distinct category per image. The uploading job also needs
      # `security-events: write`; leave it out while uploads are disabled.
      - name: Run Trivy on the images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/trivy-scan
        with:
          check-name: Trivy Scan Results
          image-prefix: docker.io/openc3inc
          tag: ${{ github.sha }}
          images: >-
            openc3-ruby
            openc3-node
            openc3-base
            openc3-cosmos-init
            openc3-redis
            openc3-buckets
            openc3-tsdb
            openc3-operator
            openc3-cosmos-cmd-tlm-api
            openc3-cosmos-script-runner-api
            openc3-traefik

  # Dependency Snapshots are recorded against GITHUB_REF, so this is kept off
  # pull requests: filing a PR branch's dependencies would corrupt the repo
  # dependency graph (and a fork PR has no write token to submit with anyway).
  # Separate job because submitting needs contents: write, which the build job
  # must not hold while it runs `docker compose build` on the checked-out tree.
  # scan-type: fs only parses manifests, so no repo code runs here.
  sbom:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by the Dependency Snapshot submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Snapshots
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          format: "github"
          exit-code: 0
          output: "dependency-results.sbom.json"
          image-ref: "."
          github-pat: ${{ secrets.GITHUB_TOKEN }}
