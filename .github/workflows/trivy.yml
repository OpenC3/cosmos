name: Trivy Scan

# Runs either from the Actions tab (workflow_dispatch, any branch) or by
# commenting "/trivy" on a pull request. The comment path is how dependency
# bump PRs get scanned without path-filtering every manifest in the repo.
#
# GitHub always runs an issue_comment workflow from the DEFAULT BRANCH with
# github.ref pointing at it, so this file's comment trigger only takes effect
# once it is merged to main, and every step below has to target the PR head
# SHA resolved at runtime rather than github.sha.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

# issue_comment runs all share github.ref (the default branch), so key the
# group on the PR number instead or a /trivy on PR B would cancel PR A.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

# Workaround for https://github.com/aquasecurity/trivy-action/issues/389
env:
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

permissions:
  contents: read

jobs:
  openc3-scan:
    runs-on: ubuntu-latest
    # issue_comment fires on every issue and PR comment in the repo, so filter
    # to PR comments that actually say /trivy.
    #
    # The author_association gate is load bearing, not politeness: this job
    # checks out the PR head and runs `docker compose build` on it while
    # holding a token with packages: write, so anyone who can trigger it can
    # execute arbitrary code against the GHCR cache. Only let people who
    # already have push access ask for that.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/trivy') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      packages: write # required to push the GHCR build cache
      pull-requests: read # read the PR head SHA
      statuses: write # post the Trivy Scan check onto the PR head
      issues: write # react to the triggering comment
    steps:
      - name: Resolve the commit to scan
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # Not interpolated into the script body: issue.number is an integer,
          # but comment.body is attacker controlled and never touches the shell.
          PR_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Resolved now, not from the comment payload, so a scan always
            # reflects the tip of the PR at the moment it was requested.
            sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -q .head.sha)
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Scanning $sha"

      - name: Acknowledge the comment
        if: ${{ github.event_name == 'issue_comment' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api --silent -X POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes

      # Posted before the build so a PR on this commit shows a pending Trivy
      # Scan row for the ~20 minutes this takes rather than nothing at all.
      # Dispatch runs post too: they are always aimed at a PR branch, so the
      # status lands on that PR the same way the comment path does.
      - name: Mark the check pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="Trivy Scan" \
            -f description="Building images and scanning" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build-cosmos keys its cache off `git ls-tree HEAD`, so the checkout
          # has to be the PR head and not the default branch.
          ref: ${{ steps.target.outputs.sha }}
      - id: build
        uses: ./.github/actions/build-cosmos
        with:
          tag: ${{ steps.target.outputs.sha }}
      - name: Manual Trivy Setup
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          cache: true
          version: v0.69.3
      - name: Run Trivy on image ruby
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # See https://github.com/aquasecurity/trivy-action
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-ruby:${{ steps.target.outputs.sha }}"
          # output: "trivy-ruby.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # NOTE: Disabling upload of SARIF files so we can see the output in the job
      # like with COSMOS Enterprise. To re-enable, uncomment the Upload lines,
      # and output: "trivy-ruby.sarif" as well as setting format: "sarif" in trivy.yaml.
      #
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-ruby"
      #     sarif_file: "trivy-ruby.sarif"
      - name: Run Trivy on image node
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-node:${{ steps.target.outputs.sha }}"
          # output: "trivy-node.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-node"
      #     sarif_file: "trivy-node.sarif"
      - name: Run Trivy on image base
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-base:${{ steps.target.outputs.sha }}"
          # output: "trivy-base.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-base"
      #     sarif_file: "trivy-base.sarif"
      - name: Run Trivy on image cosmos-init
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-cosmos-init:${{ steps.target.outputs.sha }}"
          # output: "trivy-init.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-init"
      #     sarif_file: "trivy-init.sarif"
      - name: Run Trivy on image redis
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-redis:${{ steps.target.outputs.sha }}"
          # output: "trivy-redis.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-redis"
      #     sarif_file: "trivy-redis.sarif"
      - name: Run Trivy on image bucket
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-buckets:${{ steps.target.outputs.sha }}"
          # output: "trivy-bucket.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-buckets"
      #     sarif_file: "trivy-bucket.sarif"
      - name: Run Trivy on image tsdb
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-tsdb:${{ steps.target.outputs.sha }}"
          # output: "trivy-tsdb.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-tsdb"
      #     sarif_file: "trivy-tsdb.sarif"
      - name: Run Trivy on image operator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-operator:${{ steps.target.outputs.sha }}"
          # output: "trivy-operator.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-operator"
      #     sarif_file: "trivy-operator.sarif"
      - name: Run Trivy on image cmd-tlm-api
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-cosmos-cmd-tlm-api:${{ steps.target.outputs.sha }}"
          # output: "trivy-cmd-tlm-api.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-cmd-tlm-api"
      #     sarif_file: "trivy-cmd-tlm-api.sarif"
      - name: Run Trivy on image script-runner-api
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-cosmos-script-runner-api:${{ steps.target.outputs.sha }}"
          # output: "trivy-script-runner-api.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-script-runner-api"
      #     sarif_file: "trivy-script-runner-api.sarif"
      - name: Run Trivy on image traefik
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "docker.io/openc3inc/openc3-traefik:${{ steps.target.outputs.sha }}"
          # output: "trivy-traefik.sarif"
          trivy-config: trivy.yaml
          skip-setup-trivy: true
      # - name: Upload Trivy scan results
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     category: "openc3-traefik"
      #     sarif_file: "trivy-traefik.sarif"
      # Dependency Snapshots are recorded against GITHUB_REF, which on a
      # comment run is the default branch. Submitting a PR branch's
      # dependencies under main would corrupt the repo dependency graph, so
      # only submit from an explicit dispatch.
      - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Snapshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          format: "github"
          exit-code: 0
          output: "dependency-results.sbom.json"
          image-ref: "."
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      # trivy.yaml sets exit-code: 1, so any CRITICAL/HIGH finding fails its
      # step and therefore the job. Mirror job.status onto the scanned SHA as
      # a commit status, which GitHub renders in the checks list of whatever
      # PR has that commit as its head.
      - name: Report the result as a commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          # Nothing to report against if resolving the SHA is what failed.
          [ -n "$HEAD_SHA" ] || exit 0
          case "$JOB_STATUS" in
            success)
              state=success
              desc="No unfixed CRITICAL or HIGH vulnerabilities" ;;
            failure)
              state=failure
              desc="Trivy found CRITICAL or HIGH vulnerabilities" ;;
            *)
              state=error
              desc="Scan did not complete" ;;
          esac
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="Trivy Scan" \
            -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
