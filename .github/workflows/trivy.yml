  # Dependency Snapshots are recorded against GITHUB_REF, which on a comment
  # run is the default branch - filing a PR branch's dependencies under main
  # would corrupt the repo dependency graph. Dispatch only, and a separate job
  # because submitting needs contents: write, which the scan job must not get.
  # scan-type: fs only parses manifests, so no PR code runs here.
  sbom:
    needs: authorize
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by the Dependency Snapshot submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Snapshots
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          format: "github"
          exit-code: 0
          output: "dependency-results.sbom.json"
          image-ref: "."
          github-pat: ${{ secrets.GITHUB_TOKEN }}

  # trivy.yaml sets exit-code: 1, so any CRITICAL/HIGH finding fails its step
  # and therefore the scan job. Mirror that onto the scanned SHA as a commit
  # status, which GitHub renders in the checks list of whatever PR has that
  # commit as its head. Separate job so that statuses: write is never held by
  # a runner that has executed PR code.
  report:
    needs: [authorize, scan]
    if: ${{ always() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the result as a commit status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.authorize.outputs.sha }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          set -euo pipefail
          # Nothing to report against if resolving the SHA is what failed.
          [ -n "$HEAD_SHA" ] || exit 0
          case "$SCAN_RESULT" in
            success)
              state=success
              desc="No unfixed CRITICAL or HIGH vulnerabilities" ;;
            failure)
              state=failure
              desc="Trivy found CRITICAL or HIGH vulnerabilities" ;;
            *)
              state=error
              desc="Scan did not complete ($SCAN_RESULT)" ;;
          esac
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="Trivy Scan" \
            -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
