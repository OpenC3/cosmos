# TSDB Integration Tests
# Runs end-to-end tests against a real QuestDB instance to verify
# data roundtrip through both Python and Ruby implementations.

name: TSDB Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - "openc3/python/openc3/utilities/questdb_client.py"
      - "openc3/python/openc3/models/cvt_model.py"
      - "openc3/lib/openc3/models/cvt_model.rb"
      - "openc3/lib/openc3/utilities/questdb_client.rb"
      - "openc3-cosmos-cmd-tlm-api/app/models/logged_streaming_thread.rb"
      - "openc3/test/integration/tsdb/**"
      - ".github/workflows/tsdb_integration_tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "openc3/python/openc3/utilities/questdb_client.py"
      - "openc3/python/openc3/models/cvt_model.py"
      - "openc3/lib/openc3/models/cvt_model.rb"
      - "openc3/lib/openc3/utilities/questdb_client.rb"
      - "openc3-cosmos-cmd-tlm-api/app/models/logged_streaming_thread.rb"
      - "openc3/test/integration/tsdb/**"
      - ".github/workflows/tsdb_integration_tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tsdb-integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Docker Hub OIDC login

    env:
      OPENC3_TSDB_HOSTNAME: localhost
      OPENC3_TSDB_INGEST_PORT: "9000"
      OPENC3_TSDB_QUERY_PORT: "8812"
      OPENC3_TSDB_USERNAME: admin
      OPENC3_TSDB_PASSWORD: admin
      OPENC3_SCOPE: DEFAULT

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Authenticate Docker Hub pulls via OIDC to avoid anonymous rate limits.
      # Fork PRs get no id-token, so let them fall back to anonymous pulls.
      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 49349db4-6ea2-468a-9d7a-5133cbbc5326
        with:
          username: openc3inc

      # Started here rather than as a job service container: services start
      # before any step runs, so they can't use the Docker Hub login above.
      # QuestDB image doesn't include curl, so readiness is checked from the
      # host by the "Wait for QuestDB" step below.
      - name: Start QuestDB
        run: |
          docker run -d --name questdb \
            -p 9000:9000 -p 8812:8812 \
            -e QDB_PG_USER=admin -e QDB_PG_PASSWORD=admin \
            -e QDB_HTTP_USER=admin -e QDB_HTTP_PASSWORD=admin \
            --ulimit nofile=262144:262144 \
            questdb/questdb:9.3.5

      # sync: false -- the dependency sync has to happen after the gem build
      # below, so it stays as its own step further down
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          sync: "false"

      - name: Set up Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.4"
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          working-directory: openc3

      - name: Rake build
        run: bundle exec rake build
        working-directory: openc3
        env:
          OPENC3_DEVEL: ${GITHUB_WORKSPACE}/openc3

      - name: Install Python dependencies
        working-directory: openc3/python
        run: uv sync --frozen

      - name: Install Ruby dependencies
        working-directory: openc3/test/integration/tsdb/ruby
        run: bundle install

      - name: Wait for QuestDB
        run: |
          echo "Waiting for QuestDB to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:9000/ > /dev/null; then
              echo "QuestDB is ready!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "ERROR: QuestDB failed to start within 60 seconds"
          exit 1

      - name: Run Python integration tests
        working-directory: openc3/python
        run: |
          uv run --frozen pytest ../test/integration/tsdb/python/ -v --tb=short

      - name: Run Ruby CvtModel integration tests
        working-directory: openc3/test/integration/tsdb/ruby
        run: |
          bundle exec rspec cvt_model_tsdb_spec.rb -fd

      - name: Run Ruby Streaming integration tests
        working-directory: openc3/test/integration/tsdb/ruby
        run: |
          bundle exec rspec logged_streaming_thread_tsdb_spec.rb -fd
