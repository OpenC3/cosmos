name: Playwright Tests

# Only run on a push to main to avoid running for all the dependabot PRs
on:
  push:
    paths-ignore:
      - "docs.openc3.com/**"
      - "docs/**"
    branches:
      - main
  pull_request:
    paths-ignore:
      - "docs.openc3.com/**"
    branches:
      - "**"

# Don't cancel playwright because each run can expose different race conditions and issues
# concurrency:
#   group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
#   cancel-in-progress: true

env:
  OPENC3_ARGON2_PROFILE: "unsafe_cheapest"
  # Build the tool bundles with sourcemaps (openc3-cosmos-init build arg) so
  # V8 coverage collected by the tests can map back to original sources.
  # The build-cosmos action mixes this into the init image cache key, so the
  # coverage variant caches separately from production builds.
  COVERAGE_BUILD: "1"
  # Collect V8 coverage in the Playwright fixture (chromium only) and
  # generate reports in coverage/ at teardown
  COVERAGE: "1"

permissions:
  contents: read

jobs:
  openc3-build-test:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    permissions:
      contents: read
      packages: write # required to push the GHCR build cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ./.github/actions/build-cosmos
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
      - uses: ./.github/actions/setup-playwright
      - name: Check for test.only
        run: pnpm playwright test --list --forbid-only
        working-directory: playwright
      - name: openc3.sh run
        # This `shell` line is required to get around a known issue: https://github.com/actions/runner/issues/241#issuecomment-745902718
        shell: 'script -q -e -c "bash {0}"'
        run: ./openc3.sh run
        # Allow the containers to spin up
      - name: Sleep for 2min
        run: sleep 120s
        shell: bash
        # Check container status
      - name: Check container status
        shell: 'script -q -e -c "bash {0}"'
        run: |
          docker ps
          if docker ps | grep -q Restarting; then
            echo "ERROR: One or more containers are restarting"
            exit 1
          fi
          docker logs cosmos-openc3-cosmos-init-1
          docker logs cosmos-openc3-operator-1
          docker logs cosmos-openc3-cosmos-cmd-tlm-api-1
          docker logs cosmos-openc3-cosmos-script-runner-api-1
          if docker ps | grep -q unhealthy; then
            echo "ERROR: One or more containers are unhealthy"
            exit 1
          fi
        # Build a test plugin for playwright and a copy so we can 'upgrade'.
        # The gems are a pure function of the plugin/target templates and the
        # generator, so cache them rather than paying ~1.5 min of container
        # startup and `gem build` on every run.
      - name: Cache test plugin gems
        id: pw_test_plugin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: playwright/openc3-cosmos-pw-test
          key: pw-test-plugin-${{ hashFiles('openc3/templates/plugin/**', 'openc3/templates/target/**', 'openc3/lib/openc3/utilities/cli_generator.rb', 'playwright/playwright.sh') }}
      - name: Build plugin
        if: steps.pw_test_plugin.outputs.cache-hit != 'true'
        shell: 'script -q -e -c "bash {0}"'
        run: ./playwright.sh build-plugin
        working-directory: playwright
      # tests/global.setup.ts (the 'setup' project every other project depends on)
      # waits for the interfaces to connect and then takes the demo sim out of
      # QUIET mode, so there is no separate "Wait for build" step to run here.
      - name: Run Playwright tests
        # Run separately to allow for parallelism. With COVERAGE=1 each test
        # caches V8 coverage; `pnpm coverage` (chained at the end of pnpm
        # test) merges every invocation's cache into coverage/lcov.info
        # (plus html and cobertura).
        # Enterprise specs are excluded by testIgnore on the chromium project
        # in playwright.config.ts, so no --grep-invert is needed here.
        run: ./playwright.sh run-chromium
        working-directory: playwright
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: playwright/coverage/lcov.info
          flags: frontend # See codecov.yml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test artifacts
        if: always() # Upload on pass or fail
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright
          path: playwright/test-results
          retention-days: 30
