# Builds the Docusaurus site and publishes it to GitHub Pages as an artifact.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".
# The custom domain (docs.openc3.com) must be set in the Pages settings since
# a CNAME file is ignored when deploying with a custom workflow.
name: Build and Deploy Docs

on:
  push:
    paths:
      - "docs.openc3.com/**"
      - "openc3/data/config/**"
      - ".github/workflows/generate-docs.yml"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: docs.openc3.com

      - name: Generate docs from YAML
        run: pnpm generate
        working-directory: docs.openc3.com

      - name: Build docs
        run: pnpm build
        working-directory: docs.openc3.com

      # pnpm build writes the site to ../docs (repo root docs/, not tracked in git)
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
