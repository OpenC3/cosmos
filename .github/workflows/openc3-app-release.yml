# Builds the openc3-app native installers on each OS/arch (native runners, since
# a .dmg needs macOS and a .msi/WiX needs Windows). Run it manually
# (workflow_dispatch) to build without publishing — installers land as artifacts;
# pushing an `openc3-app-v*` tag additionally attaches them to a GitHub Release.
name: openc3-app Release Packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which target to build"
        type: choice
        default: all
        options:
          - all
          - linux-x86_64
          - linux-arm64
          - macos-x86_64
          - macos-arm64
          - windows-x86_64
  push:
    tags:
      - "openc3-app-v*"
    # TEMPORARY: workflow_dispatch only works once this file is on the default
    # branch, so until it's merged to main, build on pushes to the dev branch
    # instead (dry-run — the release job is tag-gated, so nothing is published).
    # Path filters are ignored for tag pushes, so the release tag still triggers.
    # Remove this `branches`/`paths` block once the workflow is on main.
    branches:
      - super_bridge
    paths:
      - "openc3-app/**"
      - ".github/workflows/openc3-app-release.yml"

permissions:
  contents: read

concurrency:
  group: openc3-app-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compute the build matrix so a manual run can target a single OS/arch (the
  # `target` input); tag pushes always build everything.
  setup:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Build the target matrix
        id: pick
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          # macOS x86_64 is cross-compiled on an Apple-Silicon runner: the free
          # Intel runner (macos-13) was retired Dec 2025, and Intel on Actions
          # ends entirely in 2027. Each job builds an explicit --target so the
          # build arch is independent of the runner arch.
          all='[
            {"runner":"ubuntu-latest","name":"linux-x86_64","rust_target":"x86_64-unknown-linux-gnu","packager_args":"-f deb -f appimage"},
            {"runner":"ubuntu-24.04-arm","name":"linux-arm64","rust_target":"aarch64-unknown-linux-gnu","packager_args":"-f deb -f appimage"},
            {"runner":"macos-14","name":"macos-x86_64","rust_target":"x86_64-apple-darwin","packager_args":"-f dmg"},
            {"runner":"macos-14","name":"macos-arm64","rust_target":"aarch64-apple-darwin","packager_args":"-f dmg"},
            {"runner":"windows-latest","name":"windows-x86_64","rust_target":"x86_64-pc-windows-msvc","packager_args":"-f nsis -f wix"}
          ]'
          if [ "$TARGET" = "all" ]; then
            matrix=$(echo "$all" | jq -c '{include: .}')
          else
            matrix=$(echo "$all" | jq -c --arg t "$TARGET" '{include: [.[] | select(.name == $t)]}')
          fi
          echo "Selected: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    # Backstop against a hung notarization running to the 6-hour job default.
    # The notarize step below bounds each `notarytool submit` with --timeout and
    # retries once, so this only trips if something else stalls.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        working-directory: openc3-app
    steps:
      # harden-runner only supports Linux runners.
      - name: Harden the runner (Audit all outbound calls)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install/refresh the Rust toolchain
        run: |
          rustup update --no-self-update stable && rustup default stable
          rustup target add ${{ matrix.rust_target }}

      # Caches the cargo registry, build target, and installed binaries (so
      # cargo-packager isn't rebuilt every run). Keyed per-runner automatically.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: openc3-app

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build the release binary
        run: cargo build --release --target ${{ matrix.rust_target }}

      # cargo-packager takes the codesign identity from the `signing-identity`
      # config field, not an env var. Cargo.toml defaults it to ad-hoc ("-");
      # replace it with the real Developer ID when the secret is present so the
      # build is signed (and can be notarized). BSD sed (macOS runner).
      - name: Set macOS Developer ID signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            sed -i '' "s|signing-identity = \"-\"|signing-identity = \"$APPLE_SIGNING_IDENTITY\"|" Cargo.toml
            echo "Signing with: $APPLE_SIGNING_IDENTITY"
          else
            echo "No APPLE_SIGNING_IDENTITY secret; building ad-hoc signed (unsigned distribution)."
          fi

      # Notarization uses an App Store Connect API key, which must be a .p8 file
      # on disk. Decode it from the base64 secret and point APPLE_API_KEY_PATH at
      # it — only when the secret is set (otherwise the build is left unsigned).
      - name: Write App Store Connect API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            keyfile="$RUNNER_TEMP/asc_api_key.p8"
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$keyfile"
            echo "APPLE_API_KEY_PATH=$keyfile" >> "$GITHUB_ENV"
          fi

      # Fast-fail preflight: prove the App Store Connect credentials authenticate
      # and Apple's notary service is reachable BEFORE spending minutes building
      # and signing. A failure/timeout here (3 min) means a bad API key id /
      # issuer / key file or blocked egress — distinct from a slow Apple queue,
      # which shows up later in the notarize step. `head -1` prints only the PEM
      # banner, never the key material.
      - name: Verify notarization credentials (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          if [ -z "${APPLE_API_KEY_PATH:-}" ]; then
            echo "APPLE_API_KEY_PATH unset — no API key; notarization would be skipped."
            exit 0
          fi
          echo "== key file =="
          ls -l "$APPLE_API_KEY_PATH"
          head -1 "$APPLE_API_KEY_PATH"
          echo "== key id set: $([ -n "${APPLE_API_KEY:-}" ] && echo yes || echo NO), issuer set: $([ -n "${APPLE_API_ISSUER:-}" ] && echo yes || echo NO) =="
          echo "== notarytool history (proves auth + connectivity) =="
          xcrun notarytool history \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER"

      - name: Package installers
        env:
          # Build the AppImage without FUSE (unavailable on hosted runners);
          # ignored on macOS/Windows.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # macOS SIGNING ONLY. cargo-packager imports the base64 .p12 cert into
          # a temporary keychain and Developer-ID-signs the app (identity comes
          # from the Cargo.toml config field, set by the sed step above). We
          # deliberately do NOT pass the App Store Connect API key here: with no
          # notarization credentials in the environment, cargo-packager logs
          # "Skipping app notarization" and finishes. Notarization is done in the
          # dedicated step below against the final .dmg, where it's observable
          # and bounded (cargo-packager's inline `notarytool submit --wait` is
          # silent and has no timeout — it hung for 24 min on Apple's queue).
          # Absent secrets expand to empty, leaving the build ad-hoc signed.
          # Ignored on Linux/Windows. Repo secrets:
          #   APPLE_CERTIFICATE           base64 of the Developer ID .p12
          #   APPLE_CERTIFICATE_PASSWORD  its password
          #   APPLE_SIGNING_IDENTITY      "Developer ID Application: NAME (TEAMID)"
          #                               (consumed by the sed step above)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: cargo packager --release --target ${{ matrix.rust_target }} ${{ matrix.packager_args }} --out-dir dist/installers

      # Notarize the actual deliverable — the .dmg — ourselves. cargo-packager's
      # inline notarization submits a throwaway zip with a silent, unbounded
      # `notarytool submit --wait` (it hung for 24 min on Apple's queue with no
      # output). Here we get streamed progress, a hard per-attempt --timeout, one
      # retry for transient Apple stalls, the notary log on failure, and a
      # stapled ticket so the DMG passes Gatekeeper offline. Skipped (leaving the
      # DMG signed but un-notarized) when credentials are absent.
      - name: Notarize and staple the DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          if [ -z "${APPLE_API_KEY_PATH:-}" ] || [ -z "${APPLE_API_KEY:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "Notarization credentials absent — leaving the DMG signed but un-notarized."
            exit 0
          fi
          dmg=$(ls dist/installers/*.dmg | head -1)
          echo "Notarizing $dmg"

          # notarytool streams "Current status" lines; tee keeps them live while
          # capturing the output so we can pull the submission id on failure.
          # --timeout makes a stuck Apple queue fail cleanly instead of blocking.
          attempt() {
            set +e
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 15m 2>&1 | tee /tmp/notarize.out
            local rc=${PIPESTATUS[0]}
            set -e
            return $rc
          }

          if ! attempt; then
            echo "::warning::Notarization attempt 1 failed or timed out; retrying once…"
            if ! attempt; then
              id=$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/notarize.out | head -1 || true)
              if [ -n "${id:-}" ]; then
                echo "== notary log for $id =="
                xcrun notarytool log "$id" \
                  --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
              fi
              echo "::error::Notarization failed twice for $dmg"
              exit 1
            fi
          fi

          echo "Stapling $dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "OK: notarized and stapled $dmg"

      # Also ship the standalone binary as a .tar.gz so non-Debian distros (and
      # anyone who doesn't want the .deb/AppImage) can just extract and run it.
      # tar preserves the executable bit, which a bare file in the artifact zip
      # would not.
      - name: Bundle the standalone binary (Linux)
        if: runner.os == 'Linux'
        run: |
          bindir="target/${{ matrix.rust_target }}/release"
          tar -C "$bindir" -czf "dist/installers/openc3-${{ matrix.name }}.tar.gz" openc3

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openc3-app-${{ matrix.name }}
          # Exclude the loose .app bundle cargo-packager leaves beside the .dmg:
          # a .app inside the artifact zip loses its code signature (the sealed
          # CodeResources), so it fails Gatekeeper. Ship the .dmg, which keeps
          # the bundle intact.
          path: |
            openc3-app/dist/installers/*
            !openc3-app/dist/installers/*.app
          if-no-files-found: error

  # Prove the .deb installs cleanly (dependencies resolve, binary runs) in a
  # fresh Ubuntu container. Runs whenever the linux-x86_64 target was built.
  deb-smoke-test:
    name: .deb install smoke test
    needs: build
    if: ${{ github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == 'linux-x86_64' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download the linux-x86_64 installers
        run: gh run download "$GITHUB_RUN_ID" -n openc3-app-linux-x86_64 --dir pkg
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Install the .deb in a clean Ubuntu container
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" ubuntu:24.04 bash -lc '
            # No pipefail: pipelines here end in early-exit consumers (head/grep -q)
            # that SIGPIPE the upstream, which pipefail would treat as failure.
            set -eu
            deb=$(ls /pkg/*.deb | head -1)
            echo "Testing $deb"
            echo "== Depends =="
            dpkg -I "$deb" | grep -i depends
            # Guard the libxkbcommon dependency declaration (needed for the GUI).
            if ! dpkg -I "$deb" | grep -qi "libxkbcommon0"; then
              echo "ERROR: libxkbcommon0 not declared in Depends"; exit 1
            fi
            apt-get update
            apt-get install -y "$deb"
            # Find the installed executable and run it (CLI/headless needs no
            # display or libxkbcommon), proving the package works end to end.
            pkg=$(dpkg-deb -f "$deb" Package)
            bin=$(dpkg -L "$pkg" | grep "/usr/bin/" | head -1)
            echo "Binary: $bin"
            "$bin" --help >/dev/null
            echo "OK: installed and $bin --help ran"
          '

  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/openc3-app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/upload the release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download built installers
        run: gh run download "$GITHUB_RUN_ID" --dir artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Create/update the release and upload installers
        run: |
          files=$(find artifacts -type f)
          echo "Attaching:"; echo "$files"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "openc3-app $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" $files --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
