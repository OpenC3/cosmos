name: CLI Tests

# Only run on a push to main to avoid running for all the dependabot PRs
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENC3_API_PASSWORD: password
  OPENC3_API_PORT: 2900

permissions:
  contents: read

jobs:
  openc3-cli:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push the GHCR build cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-cosmos
      - name: openc3.sh run
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          ! docker ps | grep openc3
          ./openc3.sh run
          sleep 10s
          docker ps | grep openc3
      - name: openc3.sh stop
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          ./openc3.sh stop
          sleep 20s
          ! docker ps | grep openc3
      - name: openc3.sh start
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          ./openc3.sh start
          sleep 30s
          docker ps | grep openc3
      # Not testing openc3.sh dev, openc3.sh test
      - name: openc3.sh util encode,hash
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          ./openc3.sh util | grep Usage || true
          ./openc3.sh util encode hello | grep aGVsbG8=
          ./openc3.sh util hash hello | grep 2cf24d
      - name: openc3.sh util tag
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          ./openc3.sh util tag | grep "Usage: tag" || true
          ./openc3.sh util tag docker.io localhost:12345 openc3inc latest openc3 mine
          docker image ls | grep localhost:12345/openc3/openc3-cosmos-cmd-tlm-api | grep mine
          docker image ls | grep localhost:12345/openc3/openc3-cosmos-script-runner-api | grep mine
          docker image ls | grep localhost:12345/openc3/openc3-cosmos-init | grep mine
          docker image ls | grep localhost:12345/openc3/openc3-operator | grep mine
          docker image ls | grep localhost:12345/openc3/openc3-buckets | grep mine
          docker image ls | grep localhost:12345/openc3/openc3-redis | grep mine
          docker image ls | grep localhost:12345/openc3/openc3-traefik | grep mine
      - name: openc3.sh util generate
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          ### PLUGIN ###
          ./openc3.sh cli generate plugin | grep "Usage" || true
          ./openc3.sh cli generate plugin cli-test --ruby
          ./openc3.sh cli generate plugin cli-test --ruby | grep "already exists" || true
          cd openc3-cosmos-cli-test
          ../openc3.sh cli rake build VERSION=1.0.0
          ../openc3.sh cli validate openc3-cosmos-cli-test-1.0.0.gem
          ### TARGET ###
          ../openc3.sh cli generate target MY-cli --ruby
          # Verify the target name 'MY_CLI' and lib filename 'my_cli.rb'
          ls targets/MY_CLI/lib | grep my_cli.rb
          ../openc3.sh cli rake build VERSION=1.0.1
          ../openc3.sh cli validate openc3-cosmos-cli-test-1.0.1.gem
          ### MICROSERVICE ###
          ../openc3.sh cli generate microservice background --ruby
          # Verify the microservice name 'BACKGROUND' and filename 'background.rb'
          ls microservices/BACKGROUND | grep background.rb
          ../openc3.sh cli rake build VERSION=1.0.2
          ../openc3.sh cli validate openc3-cosmos-cli-test-1.0.2.gem
          ### CONVERSION ###
          ../openc3.sh cli generate conversion MY_CLI upcase --ruby
          # Verify the conversion filename 'upcase_conversion.rb'
          ls targets/MY_CLI/lib | grep upcase_conversion.rb
          ../openc3.sh cli rake build VERSION=1.0.3
          ../openc3.sh cli validate openc3-cosmos-cli-test-1.0.3.gem
          ### PROCESSOR ###
          ../openc3.sh cli generate processor MY_CLI slope --ruby
          # Verify the conversion filename 'slope_processor.rb'
          ls targets/MY_CLI/lib | grep slope_processor.rb
          ../openc3.sh cli rake build VERSION=1.0.4
          ../openc3.sh cli validate openc3-cosmos-cli-test-1.0.4.gem
          ### LIMITS_RESPONSE ###
          ../openc3.sh cli generate limits_response MY_CLI example --ruby
          # Verify the conversion filename 'example_limits_response.rb'
          ls targets/MY_CLI/lib | grep example_limits_response.rb
          ../openc3.sh cli rake build VERSION=1.0.5
          ../openc3.sh cli validate openc3-cosmos-cli-test-1.0.5.gem
      - name: openc3.sh cli xtce_converter
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          # Uses the plugin gem built by the generate step above
          cd openc3-cosmos-cli-test
          ### EXPORT ###
          # Exports are validated against the OMG XTCE 1.2 schema by default, so this
          # fails the build if the exporter writes something the schema rejects
          ../openc3.sh cli xtce_converter --plugin openc3-cosmos-cli-test-1.0.5.gem --output xtce | tee /dev/tty | grep "Validated 1 .xtce file"
          ls xtce/MY_CLI/cmd_tlm | grep my_cli.xtce
          # --no-validate skips the check
          ! ../openc3.sh cli xtce_converter --plugin openc3-cosmos-cli-test-1.0.5.gem --output xtce_novalidate --no-validate | grep "Validated"
          ### IMPORT ###
          # Round trip: what we just exported imports back into COSMOS config files
          ../openc3.sh cli xtce_converter --import xtce/MY_CLI/cmd_tlm/my_cli.xtce --output config --validate | tee /dev/tty | grep "my_cli.xtce is valid XTCE 1.2"
          ls config/MY_CLI/cmd_tlm | grep my_cli_cmd.txt
          ls config/MY_CLI/cmd_tlm | grep my_cli_tlm.txt
          # A schema invalid file is reported but still imports: 'twosCompliment' is the
          # XTCE 1.0 misspelling the 1.2 schema rejects and the COSMOS parser ignores
          sed 's/twosComplement/twosCompliment/' xtce/MY_CLI/cmd_tlm/my_cli.xtce > invalid.xtce
          ../openc3.sh cli xtce_converter --import invalid.xtce --output config_invalid --validate 2>&1 | tee /dev/tty | grep "is not valid XTCE 1.2"
          ls config_invalid/MY_CLI/cmd_tlm | grep my_cli_cmd.txt
      - name: openc3.sh cli script list, run, spawn
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          docker exec -it cosmos-openc3-redis-1 sh -c "echo -e 'AUTH openc3 openc3password\nset OPENC3__TOKEN \"\$argon2id\$v=19\$m=8,t=1,p=1\$KEDp3bRbyFK3lJLMa99kzQ\$INGoDEdgRbAG/wVie/ftzh//If91eeMTQQ5HoyKcfvY\"' | redis-cli"
          # list shows all the available file names
          ./openc3.sh cli script list | tee /dev/tty | grep "INST/procedures/stash.rb"
          # spawning a script prints only a PID
          ./openc3.sh cli script spawn INST/procedures/checks.rb | grep -v "^\s*\d+\s*$"
          # run a script that will fail and look for the failure message
          ./openc3.sh cli script run --wait 20 INST/procedures/checks.rb | tee /dev/tty | grep -q "script failed"
          # Check the running list for the first spawned script
          ./openc3.sh cli script running | tee /dev/tty | grep -q "INST/procedures/checks.rb"
          # run a script that will complete successfully
          ./openc3.sh cli script run INST/procedures/stash.rb | tee /dev/tty | grep "script complete"
          # run a suite
          ./openc3.sh cli script run INST/procedures/my_script_suite.rb --suite MySuite | tee /dev/tty | grep "script complete"
          # run a group
          ./openc3.sh cli script run INST2/procedures/my_script_suite.py --suite MySuite --group ExampleGroup | tee /dev/tty | grep "script complete"
          # run a group setup
          ./openc3.sh cli script run INST/procedures/my_script_suite.rb --suite MySuite --group ExampleGroup --method setup | tee /dev/tty | grep "script complete"
          # run a group teardown
          ./openc3.sh cli script run INST2/procedures/my_script_suite.py --suite MySuite --group ExampleGroup --method teardown | tee /dev/tty | grep "script complete"
          # run a script
          ./openc3.sh cli script run INST/procedures/my_script_suite.rb --suite MySuite --group ExampleGroup --script script_2 | tee /dev/tty | grep "script complete"
      - name: openc3.sh cli initsettings help, export
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          # --help lists the usage, every seedable setting and the JSON examples
          ./openc3.sh cli initsettings --help | tee /dev/tty > help.txt
          grep -F "Usage: cli initsettings [--dry-run | --export]" help.txt
          grep -F "time_zone: local, UTC" help.txt
          grep -F "system_health: JSON object with keys: cpu, memory, disk, global" help.txt
          grep -F "ai_chat_config" help.txt
          # An unrecognized option is reported and exits non-zero through the
          # wrapper - 'openc3.sh cli' propagates the CLI's status, so a
          # --dry-run or OPENC3_SETTINGS_STRICT failure can gate a CI job
          ! ./openc3.sh cli initsettings --bogus > bogus.txt 2>&1
          tee /dev/tty < bogus.txt | grep -F "Unknown option --bogus"
          # No OPENC3_SETTING_* variables are set on the init container by
          # default, so the real run and the dry run both have nothing to do
          # and both exit 0 (set -e catches a wrapper that always exits non-zero)
          ./openc3.sh cli initsettings | tee /dev/tty | grep -F "nothing to seed"
          ./openc3.sh cli initsettings --dry-run | tee /dev/tty | grep -F "[dry run] No"
          # --export prints what ScopeModel#seed_database wrote on first start as
          # paste-ready compose 'environment:' lines, quoted where YAML needs it
          ./openc3.sh cli initsettings --export | tee /dev/tty > export.txt
          grep -F 'OPENC3_SETTING_SOURCE_URL=https://github.com/OpenC3/cosmos' export.txt
          grep -F "OPENC3_SETTING_NEWS_FEED=true" export.txt
      - name: openc3.sh cli initsettings seeding
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          # 'openc3.sh cli' can't inject OPENC3_SETTING_* variables, so drive the
          # init container directly with the same compose files openc3.sh uses.
          # First arg is the initsettings option ('' for none), the rest are
          # docker compose run arguments.
          initsettings() {
            local opt="$1"
            shift
            docker compose --env-file .env -f compose.yaml -f compose.override.yaml \
              run --rm --no-deps "$@" \
              openc3-cosmos-init ruby /openc3/bin/openc3cli initsettings $opt
          }
          ### SEED ###
          # A setting with nothing stored is written
          initsettings "" -e OPENC3_SETTING_TIME_ZONE=UTC | tee /dev/tty | grep -F "Set default setting 'time_zone' to: \"UTC\""
          ./openc3.sh cli initsettings --export | tee /dev/tty | grep -F "OPENC3_SETTING_TIME_ZONE=UTC"
          # Seeding the same value again writes nothing
          initsettings "" -e OPENC3_SETTING_TIME_ZONE=UTC | tee /dev/tty | grep -F "already matches \"UTC\" - leaving unchanged"
          # A new value replaces one that initsettings itself wrote
          initsettings "" -e OPENC3_SETTING_TIME_ZONE=local | tee /dev/tty | grep -F "Updating unedited setting 'time_zone': \"UTC\" -> \"local\""
          ### JSON SETTINGS ###
          initsettings "" -e 'OPENC3_SETTING_CONTEXT_TAG={"text":"CI","fontColor":"#ffffff","backgroundColor":"#ff0000"}' | tee /dev/tty | grep -F "Set default setting 'context_tag'"
          # The export quotes the JSON so it can be pasted back into compose
          ./openc3.sh cli initsettings --export | tee /dev/tty | grep -F '"OPENC3_SETTING_CONTEXT_TAG={\"text\":\"CI\"'
          ### VALUES INITSETTINGS DIDN'T WRITE ###
          # seed_database wrote source_url, so it is left alone by default
          initsettings "" -e OPENC3_SETTING_SOURCE_URL=https://example.com | tee /dev/tty | grep -F "holds a value initsettings didn't write"
          # OPENC3_SETTINGS_OVERWRITE takes it anyway and says what was replaced
          initsettings "" -e OPENC3_SETTING_SOURCE_URL=https://example.com -e OPENC3_SETTINGS_OVERWRITE=1 | tee /dev/tty | grep -F "Overwriting setting 'source_url'"
          ./openc3.sh cli initsettings --export | tee /dev/tty | grep -F "OPENC3_SETTING_SOURCE_URL=https://example.com"
          ### BAD CONFIGURATION IS REPORTED, NOT FATAL ###
          # A typo in the name is skipped with a suggestion, and init continues
          initsettings "" -e OPENC3_SETTING_TIME_ZONES=UTC > unknown.txt 2>&1
          tee /dev/tty < unknown.txt | grep -F "'time_zones' is not a known COSMOS setting. Did you mean 'time_zone'?"
          grep -F "the affected setting(s) were skipped" unknown.txt
          # An invalid value for a known setting is reported the same way
          initsettings "" -e OPENC3_SETTING_TIME_ZONE=Pacific | tee /dev/tty | grep -F "Invalid value \"Pacific\" for setting 'time_zone'"
          # Malformed JSON is caught at seed time rather than read back later
          initsettings "" -e OPENC3_SETTING_ASTRO=notjson | tee /dev/tty | grep -F "is not valid JSON"
          # OPENC3_SETTINGS_STRICT turns the same problem into a failed init
          ! initsettings "" -e OPENC3_SETTING_TIME_ZONES=UTC -e OPENC3_SETTINGS_STRICT=1 > strict.txt 2>&1
          tee /dev/tty < strict.txt | grep -F "configuration problem(s)"
          ### DRY RUN ###
          # A dry run reports and exits non-zero without writing anything
          ! initsettings --dry-run -e OPENC3_SETTING_TIME_ZONE=Pacific -e OPENC3_SETTING_SUBTITLE=cli-test > dry.txt 2>&1
          tee /dev/tty < dry.txt | grep -F "[dry run] Set default setting 'subtitle' to: \"cli-test\""
          grep -F "[dry run] ERROR: Invalid value \"Pacific\"" dry.txt
          ./openc3.sh cli initsettings --export | tee /dev/tty > after_dry.txt
          ! grep -F "OPENC3_SETTING_SUBTITLE" after_dry.txt
          # An unknown name is allowed through explicitly
          initsettings "" -e OPENC3_SETTING_NOT_A_SETTING=1 -e OPENC3_SETTINGS_ALLOW_UNKNOWN=1 | tee /dev/tty | grep -F "ALLOW_UNKNOWN is set, applying anyway"
      # Removing due to write tmp/.docker_temp_3200699358: no space left on device
      # - name: openc3.sh util save,load
      #   shell: 'script -q -e -c "bash {0}"'
      #   run: |
      #     set -e
      #     ./openc3.sh util save docker.io openc3inc latest
      #     # Verify the images were saved
      #     ls tmp | grep openc3-cosmos-cmd-tlm-api-latest.tar
      #     ls tmp | grep openc3-cosmos-script-runner-api-latest.tar
      #     ls tmp | grep openc3-cosmos-init-latest.tar
      #     ls tmp | grep openc3-operator-latest.tar
      #     ls tmp | grep openc3-buckets-latest.tar
      #     ls tmp | grep openc3-redis-latest.tar
      #     ls tmp | grep openc3-traefik-latest.tar
      #     docker image rm openc3inc/openc3-cosmos-cmd-tlm-api:latest
      #     docker image rm openc3inc/openc3-cosmos-script-runner-api:latest
      #     docker image rm openc3inc/openc3-cosmos-init:latest
      #     docker image rm openc3inc/openc3-operator:latest
      #     docker image rm openc3inc/openc3-buckets:latest
      #     docker image rm openc3inc/openc3-redis:latest
      #     docker image rm openc3inc/openc3-traefik:latest
      #     ./openc3.sh util load
      #     # Verify the images were loaded
      #     docker image ls | grep openc3-cosmos-cmd-tlm-api
      #     docker image ls | grep openc3-cosmos-script-runner-api
      #     docker image ls | grep openc3-cosmos-init
      #     docker image ls | grep openc3-operator
      #     docker image ls | grep openc3-buckets
      #     docker image ls | grep openc3-redis
      #     docker image ls | grep openc3-traefik
      - name: Cleanup volumes
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          docker volume ls | grep openc3
          ./openc3.sh cleanup force
          ! docker volume ls | grep openc3
