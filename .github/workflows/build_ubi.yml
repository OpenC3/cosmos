name: Build UBI

# Only run on a push to main to avoid running for all the dependabot PRs
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Workaround for https://github.com/aquasecurity/trivy-action/issues/389
# Trivy tries each comma-separated repository in order, so a rate limit on one
# (e.g. public.ecr.aws "TOOMANYREQUESTS: Data limit exceeded") falls through.
env:
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
  # The Fetch VEX Hub step puts the VEX hub in the trivy cache; trivy's own
  # fetch goes through the GitHub API and fails (see fetch-vexhub/action.yml).
  TRIVY_SKIP_VEX_REPO_UPDATE: "true"
  # trivy-action's default cache-dir, which Fetch VEX Hub writes to. Set so
  # the bare trivy CLI below reads the same place.
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

permissions:
  contents: read

jobs:
  openc3-build-ubi:
    # Fork PRs (like dependabot's) get no secrets, and Registry1 has no
    # anonymous pulls, so the UBI base images cannot be fetched. Their changes
    # are still built by the push to main after merge.
    #
    # This is a required check. A job skipped by its `if` reports "Skipped",
    # which GitHub counts as success, so skipping does not block the merge:
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/using-conditions-to-control-job-execution
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    permissions:
      contents: read
      # The Trivy scan below posts its result as its own check run so it is
      # not folded into this job's pass/fail.
      checks: write
      id-token: write # required for Docker Hub OIDC login
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Authenticate Docker Hub pulls via OIDC to avoid anonymous rate limits.
      # Fork PRs get no id-token, so let them fall back to anonymous pulls.
      - name: Docker login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 49349db4-6ea2-468a-9d7a-5133cbbc5326
          DOCKERHUB_OIDC_EXPIREIN: 3600 # token defaults to 5 min; long builds pull from Docker Hub later
        with:
          username: openc3inc
      - name: login to ironbank
        # This `shell` line is required to get around a known issue: https://github.com/actions/runner/issues/241#issuecomment-745902718
        shell: 'script -q -e -c "bash {0}"'
        env:
          # Create ENV variable for the IronBank registry CLI token, which is stored as a secret in GitHub
          # This is done to avoid expanding secrets directly in a run block
          # where they may be exposed in process lists, shell history, or files.
          IRONBANK_REGISTRY_CLI: ${{ secrets.IRONBANK_REGISTRY_CLI }}
        run: echo "$IRONBANK_REGISTRY_CLI" | docker login registry1.dso.mil -u jmthomas --password-stdin
      - name: openc3.sh build-ubi
        id: build
        # This `shell` line is required to get around a known issue: https://github.com/actions/runner/issues/241#issuecomment-745902718
        shell: 'script -q -e -c "bash {0}"'
        run: ./openc3.sh build-ubi
      - name: openc3.sh run-ubi
        shell: 'script -q -e -c "bash {0}"'
        run: ./openc3.sh run-ubi
        # Allow the containers to spin up
      - name: Sleep for 3min
        run: sleep 180s
        shell: bash
        # Check container status
      - name: Check container status
        shell: bash
        run: |
          docker ps
          if docker ps | grep -q Restarting; then
            echo "ERROR: One or more containers are restarting"
            exit 1
          fi
          docker logs cosmos-openc3-cosmos-init-1
          docker logs cosmos-openc3-operator-1
          if docker ps | grep -q unhealthy; then
            echo "ERROR: One or more containers are unhealthy"
            exit 1
          fi

      # The UBI images are scanned here instead of in trivy.yml because they
      # are never published: scanning them anywhere else means building all 11
      # of them again, and unlike the Debian images they have no GHCR build
      # cache. The build above already left them in the local docker daemon.
      #
      # Installs the trivy binary the scan step below calls directly. The
      # trivy release is pinned in that action.
      - name: Manual Trivy Setup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/setup-trivy
      - name: Fetch VEX Hub
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/fetch-vexhub
      # scripts/linux/openc3_build_ubi.sh tags the images with these .env
      # values, so read them rather than hardcoding the reference.
      - name: UBI image reference
        id: ubi-ref
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          registry=$(grep -E '^OPENC3_REGISTRY=' .env | cut -d= -f2)
          namespace=$(grep -E '^OPENC3_NAMESPACE=' .env | cut -d= -f2)
          tag=$(grep -E '^OPENC3_TAG=' .env | cut -d= -f2)
          echo "prefix=${registry}/${namespace}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      # A vulnerable IronBank base image is not a broken build: the traefik
      # UBI image, for one, is rebuilt upstream on RedHat's schedule, not ours.
      # Findings are posted as a neutral (gray) "Trivy UBI Scan Results" check
      # run and as warnings, so this job reports only whether the UBI images
      # built and came up.
      - name: Run Trivy on the UBI images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/trivy-scan
        with:
          check-name: Trivy UBI Scan Results
          image-prefix: ${{ steps.ubi-ref.outputs.prefix }}
          tag: ${{ steps.ubi-ref.outputs.tag }}
          images: >-
            openc3-ruby-ubi
            openc3-base-ubi
            openc3-node-ubi
            openc3-buckets-ubi
            openc3-redis-ubi
            openc3-tsdb-ubi
            openc3-cosmos-cmd-tlm-api-ubi
            openc3-cosmos-script-runner-api-ubi
            openc3-operator-ubi
            openc3-traefik-ubi
            openc3-cosmos-init-ubi
