name: Build UBI

# Only run on a push to main to avoid running for all the dependabot PRs
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Workaround for https://github.com/aquasecurity/trivy-action/issues/389
env:
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

permissions:
  contents: read

jobs:
  openc3-build-ubi:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    permissions:
      contents: read
      # Report Trivy status below publishes the scan result as its own commit
      # status so it is not folded into this job's pass/fail.
      statuses: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: login to ironbank
        # This `shell` line is required to get around a known issue: https://github.com/actions/runner/issues/241#issuecomment-745902718
        shell: 'script -q -e -c "bash {0}"'
        env:
          # Create ENV variable for the IronBank registry CLI token, which is stored as a secret in GitHub
          # This is done to avoid expanding secrets directly in a run block
          # where they may be exposed in process lists, shell history, or files.
          IRONBANK_REGISTRY_CLI: ${{ secrets.IRONBANK_REGISTRY_CLI }}
        run: echo "$IRONBANK_REGISTRY_CLI" | docker login registry1.dso.mil -u jmthomas --password-stdin
      - name: openc3.sh build-ubi
        id: build
        # This `shell` line is required to get around a known issue: https://github.com/actions/runner/issues/241#issuecomment-745902718
        shell: 'script -q -e -c "bash {0}"'
        run: ./openc3.sh build-ubi
      - name: openc3.sh run-ubi
        shell: 'script -q -e -c "bash {0}"'
        run: ./openc3.sh run-ubi
        # Allow the containers to spin up
      - name: Sleep for 3min
        run: sleep 180s
        shell: bash
        # Check container status
      - name: Check container status
        shell: bash
        run: |
          docker ps
          if docker ps | grep -q Restarting; then
            echo "ERROR: One or more containers are restarting"
            exit 1
          fi
          docker logs cosmos-openc3-cosmos-init-1
          docker logs cosmos-openc3-operator-1
          if docker ps | grep -q unhealthy; then
            echo "ERROR: One or more containers are unhealthy"
            exit 1
          fi

      # The UBI images are scanned here instead of in trivy.yml because they
      # are never published: scanning them anywhere else means building all 11
      # of them again, and unlike the Debian images they have no GHCR build
      # cache. The build above already left them in the local docker daemon.
      #
      # aquasecurity/setup-trivy installs the binary the scan step below calls
      # directly. The version here is the trivy release, not the action:
      # dependabot bumps the action SHA but cannot see this input, so it is
      # watched by .github/workflows/tool_version_check.yml instead.
      - name: Manual Trivy Setup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          cache: true
          version: v0.74.0
      - name: Run Trivy on the UBI images
        id: trivy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # A vulnerable IronBank base image is not a broken build: the traefik
        # UBI image, for one, is rebuilt upstream on RedHat's schedule, not
        # ours. Let the job go green and carry the scan verdict in the separate
        # commit status posted by the next step.
        continue-on-error: true
        shell: bash
        env:
          UBI_IMAGES: >-
            openc3-ruby-ubi
            openc3-base-ubi
            openc3-node-ubi
            openc3-buckets-ubi
            openc3-redis-ubi
            openc3-tsdb-ubi
            openc3-cosmos-cmd-tlm-api-ubi
            openc3-cosmos-script-runner-api-ubi
            openc3-operator-ubi
            openc3-traefik-ubi
            openc3-cosmos-init-ubi
        run: |
          # scripts/linux/openc3_build_ubi.sh tags the images with these .env
          # values, so read them rather than hardcoding the reference.
          registry=$(grep -E '^OPENC3_REGISTRY=' .env | cut -d= -f2)
          namespace=$(grep -E '^OPENC3_NAMESPACE=' .env | cut -d= -f2)
          tag=$(grep -E '^OPENC3_TAG=' .env | cut -d= -f2)
          # --image-src docker pins each scan to the image just built. Without
          # it trivy falls back to pulling the published image of the same name
          # from Docker Hub, which would scan the last release, not this PR.
          #
          # trivy.yaml sets exit-code 1 on CRITICAL/HIGH, so record the failure
          # and keep going: one vulnerable base image should not hide the
          # findings in the other ten.
          failed=()
          for image in $UBI_IMAGES; do
            echo "::group::trivy ${image}"
            trivy image --config trivy.yaml --image-src docker \
              "${registry}/${namespace}/${image}:${tag}" || failed+=("$image")
            echo "::endgroup::"
          done

          # Each image's output is inside a collapsed ::group:: and a clean
          # image still prints a full all-zero Report Summary, so a reader who
          # only sees "exit code 1" cannot tell which of the 11 failed without
          # expanding every one. Name them where they are visible unexpanded.
          {
            echo "### Trivy UBI scan"
            if [ ${#failed[@]} -eq 0 ]; then
              echo "No fixable CRITICAL/HIGH vulnerabilities."
            else
              echo "Fixable CRITICAL/HIGH vulnerabilities in:"
              printf -- '- `%s`\n' "${failed[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          for image in "${failed[@]}"; do
            echo "::error title=Trivy::${image} has fixable CRITICAL/HIGH vulnerabilities"
          done
          [ ${#failed[@]} -eq 0 ]

      # Published as a commit status rather than left as this job's outcome so
      # "did the UBI images build and come up" and "is a base image currently
      # vulnerable" are two checks on the PR instead of one. Do not mark this
      # status required unless the images are ones we can actually patch.
      - name: Report Trivy status
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On a pull_request event github.sha is the throwaway merge commit,
          # which is not the commit the PR shows checks against.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME: ${{ steps.trivy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$OUTCOME" in
            success) state=success; desc="No fixable CRITICAL/HIGH vulnerabilities" ;;
            skipped) state=error;   desc="Image build failed, scan did not run" ;;
            *)       state=failure; desc="Fixable CRITICAL/HIGH vulnerabilities found" ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" \
            -f context="Trivy UBI Scan" \
            -f target_url="$RUN_URL" \
            -f description="$desc"
