name: Build COSMOS
description: |
  Build COSMOS Docker images with per-image GHCR-backed caching.

  Each image's cache key is a hash of (its own context paths) + (its parent
  images' hashes, chained) + (global build inputs: compose.yaml,
  compose-build.yaml, .env). A change to one image (e.g. openc3-traefik)
  only invalidates that image's cache; an openc3-base change invalidates
  openc3-base and its 4 children but leaves the 6 unrelated images cached.

  On per-image hit: pull ghcr.io/openc3/${img}-buildcache:cache-<hash> and
  retag as docker.io/openc3inc/${img}:${tag}. On miss: rebuild only the
  missed services in topological order; pulled parents satisfy their FROM
  lines locally without being rebuilt. After the build, only the newly
  built images are pushed to GHCR.

  OS package freshness: the cache key only reflects repo files, so a hit would
  otherwise pin the package upgrade each Dockerfile runs at build time forever.
  When push-cache is true, a hit on an image that upgrades packages
  (openc3-ruby, -buckets, -redis, -tsdb, -traefik) is probed by simulating the
  upgrade (apt, apk or dnf) inside it. If fixes have been published, that image
  and every image built FROM it are rebuilt (the probed image without the layer
  cache) and pushed over the same cache tags. Cost on a clean run is one short
  `docker run` per probed image.

  Upstream republishes: bases like ruby:3.4-slim-trixie get rebuilt under the
  same tag with patched binaries, which the package probe can't see. So the
  registry digest of each image's external base (openc3-node's node image
  included) is mixed into its cache key. A republished tag becomes an ordinary
  miss and cascades to children. If a digest can't be looked up, the image and
  its descendants are built but not pushed, rather than cached under a key
  that claims to be fresh. Read-only consumers (push-cache false) compute the
  same key, so they miss after a republish until core CI pushes the new key.

  Local developer builds via ./openc3.sh build are unaffected.

  Enterprise checks core out at cosmos/, so its workflow uses this action as
  ./cosmos/.github/actions/build-cosmos with working-directory: cosmos and
  push-cache: false - the cache packages are written by core CI only. Note
  that enterprise must also pin OPENC3_TAG to something other than "latest"
  for the whole job: its own ./openc3.sh build calls build_core_images, which
  re-runs `docker compose build` on every core image when the tag is "latest".
  A pulled image does not seed the BuildKit layer cache, so that rebuild would
  throw away everything this action just restored.

  The cleanup workflow at .github/workflows/cleanup-ghcr.yml prunes old
  cache entries nightly so the *-buildcache packages don't accumulate.

inputs:
  tag:
    description: OPENC3_TAG to apply to the resulting docker.io/openc3inc/* tags.
    required: false
    default: latest
  working-directory:
    description: |
      Directory holding compose.yaml, compose-build.yaml, .env and the image
      build contexts. Must be inside a git checkout - the cache keys come from
      `git ls-tree HEAD`.
    required: false
    default: .
  push-cache:
    description: |
      Whether to push newly built images to the GHCR cache. Only the core repo
      may write these packages: they are keyed on core's `git ls-tree HEAD`, so
      an entry pushed from anywhere else could be built from a different core
      tree than its hash claims. Consumers outside this repo (enterprise) pass
      false and read the cache only.
    required: false
    default: "true"

outputs:
  images-file:
    description: |
      Path to a file of `<image>=<hash>` lines in topological order. A
      downstream action that builds images FROM these can read it to chain
      its own parent hashes.
    value: ${{ steps.hashes.outputs.images-file }}

runs:
  using: composite
  steps:
    - name: Compute per-image hashes
      id: hashes
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WORKDIR: ${{ inputs.working-directory }}
      # Spec rows are <name>|<context paths>|<parent images>, in topological
      # order (parents before children). Each image's hash chains its parents'
      # hashes so a base change cascades. 12 hex chars is plenty at our scale.
      run: |
        set -e
        # Key the bookkeeping files on the working directory so a second
        # invocation in the same job (enterprise builds core at cosmos/, then
        # its own images at the workspace root) doesn't clobber the first.
        slug=$(printf '%s' "$WORKDIR" | tr -c 'A-Za-z0-9' '-')
        images_file="$RUNNER_TEMP/cosmos-images-${slug}.env"
        misses_file="$RUNNER_TEMP/cosmos-misses-${slug}.txt"
        echo "images-file=$images_file" >> "$GITHUB_OUTPUT"
        echo "misses-file=$misses_file" >> "$GITHUB_OUTPUT"
        parents_file="$RUNNER_TEMP/cosmos-parents-${slug}.txt"
        stale_file="$RUNNER_TEMP/cosmos-stale-${slug}.txt"
        echo "parents-file=$parents_file" >> "$GITHUB_OUTPUT"
        echo "stale-file=$stale_file" >> "$GITHUB_OUTPUT"
        nopush_file="$RUNNER_TEMP/cosmos-nopush-${slug}.txt"
        echo "nopush-file=$nopush_file" >> "$GITHUB_OUTPUT"

        common=$(git ls-tree -r HEAD compose.yaml compose-build.yaml .env \
          | sha256sum | cut -c1-12)

        declare -A HASH
        declare -A NOPUSH
        : > "$images_file"
        : > "$parents_file"
        : > "$nopush_file"

        # Images with an external base whose tag upstream may republish.
        # Parsed from the Dockerfile so the ref can't drift from the FROM.
        DIGEST_IMAGES=" openc3-ruby openc3-buckets openc3-tsdb openc3-redis openc3-traefik openc3-node "

        # Prints the first FROM of <dir>/Dockerfile with its pre-FROM ARG
        # defaults substituted, letting .env override them (compose passes
        # those through as build args).
        base_ref() {
          local line k ev ref=""
          local -A args
          while IFS= read -r line; do
            case "$line" in
              ARG\ *=*)
                line=${line#ARG }
                args[${line%%=*}]=${line#*=}
                ;;
              FROM\ *)
                ref=${line#FROM }
                ref=${ref%% *}
                break
                ;;
            esac
          done < "$1/Dockerfile"
          for k in "${!args[@]}"; do
            ev=$(grep -m1 "^${k}=" .env | cut -d= -f2- || true)
            if [ -n "$ev" ]; then
              args[$k]=$ev
            fi
            ref=${ref//"\${${k}}"/${args[$k]}}
          done
          printf '%s' "$ref"
        }

        while IFS='|' read -r name ctx_str parents_str; do
          [ -z "$name" ] && continue
          echo "${name}|${parents_str}" >> "$parents_file"
          read -ra ctx <<< "$ctx_str"
          own=$(git ls-tree -r HEAD "${ctx[@]}" | sha256sum | cut -c1-12)
          # openc3-cosmos-init consumes the COVERAGE_BUILD build arg (the
          # playwright workflow sets it to 1 for sourcemapped tool bundles).
          # Mix it into the hash so coverage and production variants get
          # separate cache entries instead of poisoning each other.
          if [ "$name" = "openc3-cosmos-init" ]; then
            own="${own}-cov${COVERAGE_BUILD:-0}"
          fi
          # Mix in the base image's registry digest (see action description).
          if [[ "$DIGEST_IMAGES" == *" $name "* ]]; then
            ref=$(base_ref "${ctx[0]}")
            d=$(docker buildx imagetools inspect "$ref" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')
            if [[ "$ref" != *'${'* && "$d" == sha256:* ]]; then
              own="${own}-${d#sha256:}"
            else
              echo "::warning::Could not resolve digest for ${name} base '${ref}'; building without caching it"
              # Run-unique so nothing chained onto this hash (including
              # enterprise images) can ever match a cache entry.
              own="${own}-nodigest-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
              NOPUSH[$name]=1
            fi
          fi
          parent_hashes=""
          for p in $parents_str; do
            parent_hashes="$parent_hashes ${HASH[$p]}"
            if [ -n "${NOPUSH[$p]:-}" ]; then
              NOPUSH[$name]=1
            fi
          done
          if [ -n "${NOPUSH[$name]:-}" ]; then
            echo "$name" >> "$nopush_file"
          fi
          h=$(printf '%s %s %s' "$common" "$own" "$parent_hashes" \
            | sha256sum | cut -c1-12)
          HASH[$name]=$h
          echo "${name}=${h}" >> "$images_file"
          echo "Hash[$name] = $h"
        done <<'EOF'
        openc3-ruby|openc3-ruby|
        openc3-buckets|openc3-buckets|
        openc3-tsdb|openc3-tsdb|
        openc3-redis|openc3-redis|
        openc3-traefik|openc3-traefik|
        openc3-base|openc3|openc3-ruby
        openc3-node|openc3-node|openc3-base
        openc3-cosmos-cmd-tlm-api|openc3-cosmos-cmd-tlm-api|openc3-base
        openc3-cosmos-script-runner-api|openc3-cosmos-script-runner-api|openc3-base
        openc3-operator|openc3-operator|openc3-base
        openc3-cosmos-init|openc3-cosmos-init docs.openc3.com|openc3-node openc3-base
        EOF

    - name: Login to GHCR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
          || echo "::warning::GHCR login failed (likely a fork PR); cache pull/push will be skipped"

    - name: Pull cached images
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        IMAGES_FILE: ${{ steps.hashes.outputs.images-file }}
        MISSES_FILE: ${{ steps.hashes.outputs.misses-file }}
        PARENTS_FILE: ${{ steps.hashes.outputs.parents-file }}
        STALE_FILE: ${{ steps.hashes.outputs.stale-file }}
        PUSH_CACHE: ${{ inputs.push-cache }}
        # Images whose Dockerfile upgrades OS packages at build time. Keep in
        # step with the Dockerfiles: openc3-ruby/buckets/redis use apt-get,
        # openc3-tsdb dnf, openc3-traefik apk or dnf. openc3-base and its
        # children only inherit from openc3-ruby, so they need no probe.
        PROBE_IMAGES: openc3-ruby openc3-buckets openc3-redis openc3-tsdb openc3-traefik
      # For each image, attempt to pull its per-hash cache tag. On hit, retag
      # to docker.io/openc3inc/${name}:${TAG} so it serves as a local FROM
      # source for any downstream miss. Misses are recorded for the build step.
      #
      # The cache key only reflects repo files, so a hit can hold OS packages
      # that have since been fixed upstream. When this run may write the cache, a hit
      # on a PROBE_IMAGES entry is probed: if a simulated package upgrade inside
      # it would change anything, it is treated as a miss and rebuilt without
      # the layer cache. Images are visited parents first, so everything built
      # FROM a stale image (openc3-ruby's descendants) is forced to miss too.
      # The rebuilt image is pushed over the same cache tag, so the next run
      # probes clean and hits. Read-only consumers (push-cache false)
      # skip the probe: they could not publish the refresh, so they would
      # rebuild on every run until core CI refreshed the entry.
      run: |
        set -e
        : > "$MISSES_FILE"
        : > "$STALE_FILE"
        declare -A STALE
        hits=0
        misses=0

        # Prints how many packages a package-manager upgrade would change,
        # using whichever of apt, apk or dnf the image has. Fails (non-zero)
        # when the probe could not run: no known package manager, no shell,
        # or the mirror is unreachable.
        PROBE_SCRIPT='
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq >/dev/null 2>&1 || exit 99
          apt-get -s upgrade | grep -c "^Inst" || true
        elif command -v apk >/dev/null 2>&1; then
          apk update -q >/dev/null 2>&1 || exit 99
          apk upgrade -s | grep -c "Upgrading" || true
        elif command -v dnf >/dev/null 2>&1; then
          out=$(dnf -q check-update 2>/dev/null); rc=$?
          case $rc in
            0) echo 0 ;;
            100) printf "%s\n" "$out" | grep -cE "^[^[:space:]]+\.[^[:space:]]+[[:space:]]+[^[:space:]]+[[:space:]]+[^[:space:]]+" || true ;;
            *) exit 99 ;;
          esac
        else
          exit 99
        fi'
        pending_updates() {
          docker run --rm --user 0 --entrypoint sh "$1" -c "$PROBE_SCRIPT"
        }

        while IFS='=' read -r name hash; do
          [ -z "$name" ] && continue
          src="ghcr.io/openc3/${name}-buildcache:cache-${hash}"

          parents=$(grep -m1 "^${name}|" "$PARENTS_FILE" | cut -d'|' -f2 || true)
          stale_parent=""
          for p in $parents; do
            if [ -n "${STALE[$p]:-}" ]; then
              stale_parent=$p
            fi
          done
          if [ -n "$stale_parent" ]; then
            STALE[$name]=1
            echo "$name" >> "$MISSES_FILE"
            misses=$((misses+1))
            echo "::notice::Cache MISS ${name} (${hash}) - parent ${stale_parent} is being refreshed"
            continue
          fi

          if docker pull "$src" 2>/dev/null; then
            docker tag "$src" "docker.io/openc3inc/${name}:${TAG}"
            if [ "$PUSH_CACHE" = "true" ] && [[ " $PROBE_IMAGES " == *" $name "* ]]; then
              if pending=$(pending_updates "$src"); then
                if [ "$pending" -gt 0 ]; then
                  STALE[$name]=1
                  echo "$name" >> "$STALE_FILE"
                  echo "$name" >> "$MISSES_FILE"
                  misses=$((misses+1))
                  echo "::notice::Cache STALE ${name} (${hash}) - ${pending} package upgrades pending, rebuilding"
                  continue
                fi
              else
                echo "::warning::Could not check ${name} for pending package upgrades; using cached image"
              fi
            fi
            hits=$((hits+1))
            echo "::notice::Cache HIT  ${name} (${hash})"
          else
            echo "$name" >> "$MISSES_FILE"
            misses=$((misses+1))
            echo "::notice::Cache MISS ${name} (${hash})"
          fi
        done < "$IMAGES_FILE"
        echo "::notice::Build cache: ${hits} hit, ${misses} miss"

    - name: Build missed images
      # script -q -e -c works around https://github.com/actions/runner/issues/241
      shell: 'script -q -e -c "bash {0}"'
      working-directory: ${{ inputs.working-directory }}
      env:
        OPENC3_TAG: ${{ inputs.tag }}
        MISSES_FILE: ${{ steps.hashes.outputs.misses-file }}
        STALE_FILE: ${{ steps.hashes.outputs.stale-file }}
      # Misses are already in topological order (the hash step writes them
      # that way). Pulled parents are tagged locally as openc3inc/${name}:${TAG},
      # so a child-only miss resolves its FROM without rebuilding the parent.
      # Stale images get --no-cache --pull so a warm BuildKit layer cache
      # (self-hosted runners) can't replay the old `apt-get upgrade` layer.
      # Children need no flag: their changed parent invalidates their layers.
      run: |
        set -e
        if [ ! -s "$MISSES_FILE" ]; then
          echo "::notice::All images cached - skipping build"
          exit 0
        fi
        ./scripts/linux/openc3_setup.sh
        umask 0022
        chmod -R +r .
        while read -r name; do
          [ -z "$name" ] && continue
          echo "::group::docker compose build ${name}"
          build_args=()
          # Images whose only FROM is external get --pull so a republished
          # base isn't shadowed by a copy already on the runner. (openc3-node
          # is left out: --pull would also try to fetch its openc3-ruby parent
          # from Docker Hub.)
          case " openc3-ruby openc3-buckets openc3-tsdb openc3-redis openc3-traefik " in
            *" $name "*) build_args=(--pull) ;;
          esac
          if grep -qx "$name" "$STALE_FILE"; then
            build_args=(--no-cache --pull)
          fi
          docker compose -f compose.yaml -f compose-build.yaml build "${build_args[@]}" "$name"
          echo "::endgroup::"
        done < "$MISSES_FILE"

    - name: Push built images to GHCR cache
      if: ${{ inputs.push-cache == 'true' }}
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        IMAGES_FILE: ${{ steps.hashes.outputs.images-file }}
        MISSES_FILE: ${{ steps.hashes.outputs.misses-file }}
        NOPUSH_FILE: ${{ steps.hashes.outputs.nopush-file }}
      # Images in NOPUSH_FILE had no base digest to key on (or descend from one
      # that didn't), so they are built but not cached.
      # Best-effort: a push failure (e.g. fork PR with no packages:write) is
      # logged but does not fail the run.
      run: |
        set +e
        if [ ! -s "$MISSES_FILE" ]; then
          echo "::notice::No images to push (all cached)"
          exit 0
        fi
        declare -A H
        while IFS='=' read -r name hash; do
          [ -z "$name" ] && continue
          H[$name]=$hash
        done < "$IMAGES_FILE"

        while read -r name; do
          [ -z "$name" ] && continue
          if grep -qx "$name" "$NOPUSH_FILE"; then
            echo "::notice::Not caching ${name}: base digest unavailable"
            continue
          fi
          dst="ghcr.io/openc3/${name}-buildcache:cache-${H[$name]}"
          docker tag "docker.io/openc3inc/${name}:${TAG}" "$dst"
          if ! docker push "$dst"; then
            echo "::warning::Push failed for ${dst}"
          fi
        done < "$MISSES_FILE"
