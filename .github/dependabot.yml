# Updates are grouped so each ecosystem produces a single weekly PR for
# minor/patch bumps. Major version updates are intentionally left out of the
# groups so Dependabot opens an individual PR for each one (they usually need
# manual review).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Majors get their own pull request. Excluding them entirely is how
      # setup-uv silently sat on v8 while upstream reached v10, but bundling
      # them with the routine bumps is worse: one group is one PR, so a single
      # breaking upgrade among ~27 actions blocks all of them, and Actions
      # treats a renamed input as a warning rather than an error, so a green
      # run does not prove a major was harmless.
      #
      # Order matters here: a dependency joins the first group it matches.
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /openc3/python
    schedule:
      interval: weekly
    ignore:
      - dependency-name: openc3
    groups:
      # Majors deliberately excluded. This pattern covers the runtime
      # dependencies of the published openc3 package, every one of which has a
      # deliberate upper cap (boto3 <2, lxml <7, psycopg <4, valkey <7, ...).
      # A major bump means raising that cap, which changes what downstream
      # users resolve, so it should be a maintainer decision rather than a
      # weekly automated PR.
      #
      # ruff and ty lose nothing here: both are pre-1.0, so their breaking
      # releases arrive as minors today. .github/workflows/tool_version_check.yml
      # watches them, uv and mypy against upstream and files a tracking issue,
      # which is the notification this exclusion would otherwise cost.
      uv:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Bundler
  - package-ecosystem: bundler
    directories:
      - /
      - /openc3
      - /openc3-cosmos-cmd-tlm-api
      - /openc3-cosmos-script-runner-api
      - /openc3/test/integration/tsdb/ruby
    schedule:
      interval: weekly
    groups:
      bundler:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Docker
  - package-ecosystem: docker
    directories:
      - /openc3
      - /openc3-buckets
      - /openc3-cosmos-cmd-tlm-api
      - /openc3-cosmos-init
      - /openc3-cosmos-script-runner-api
      - /openc3-node
      - /openc3-operator
      - /openc3-redis
      - /openc3-ruby
      - /openc3-traefik
      - /openc3-tsdb
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Ignore all npm updates as we have a process for uding them with package_audit.rb
  - package-ecosystem: npm
    directories: # Location of package manifests
      - /openc3-cosmos-init/plugins/*
      - /playwright/*
      - /docs.openc3.com/*
      - /openc3/templates/*
    schedule:
      interval: weekly
    ignore: # because we do extra stuff with these. See index.html in tool-base or `base_pkgs` in package_audit.rb
      - dependency-name: import-map-overrides
      - dependency-name: pinia
      - dependency-name: single-spa
      - dependency-name: systemjs
      - dependency-name: vue
      - dependency-name: vue-router
      - dependency-name: vuetify
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
