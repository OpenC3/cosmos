---
VARIABLE:
  summary: Define a configurable variable for the plugin
  description: The VARIABLE keyword defines a variable that will be requested for the user to enter during plugin installation.   Variables can be used to handle details of targets that are user defined such as specific IP addresses and ports.  Variables should also be used to allow users to rename targets to whatever name they want and support multiple installations of the same target with different names.
    Variables can be used later in plugin.txt or in any other configuration file included in a plugin using Ruby ERB syntax.  The variables are assigned to accessible local variables in the file.
    At a high level, ERB allows you to run Ruby code in configuration files.
  parameters:
    - name: Variable Name
      required: true
      description: The name of the variable
      values: .+
    - name: Default Value
      required: true
      description: Default value of the variable
      values: .+
VARIABLE_DESCRIPTION:
  summary: Add a description to a plugin variable
  description: The VARIABLE_DESCRIPTION keyword adds a human-readable description to a previously defined VARIABLE.
    This description appears as hint text below the variable input field during plugin installation.
    Must follow a VARIABLE definition.
  since: 7.0.0
  example: |
    VARIABLE port 8080
    VARIABLE_DESCRIPTION "TCP port for the target connection"
  parameters:
    - name: Description
      required: true
      description: Human-readable description of the variable's purpose
      values: .+
VARIABLE_BRIDGE:
  summary: Let the user select which bridge the plugin uses
  description: The VARIABLE_BRIDGE keyword defines a variable named bridge_name whose value is selected from the
    bridges available in COSMOS when the plugin is installed. Bridges connect COSMOS to openc3-app running on a host
    computer, so this chooses which host the plugin's bridged interfaces and VARIABLE_DISCOVERY run on.
    Use bridge_name in ERB like any other variable, for example with the BRIDGE interface modifier.
    VARIABLE_DESCRIPTION, VARIABLE_STATE and the other VARIABLE modifiers can follow it.
    Defining VARIABLE bridge_name in the same plugin.txt is an error.
  since: 7.5.0
  example: |
    VARIABLE_BRIDGE
      VARIABLE_DESCRIPTION "Bridge to the computer the serial device is connected to"
    VARIABLE serial_port /dev/ttyUSB0
      VARIABLE_DISCOVERY openc3/discovery/serial_discovery.py
    INTERFACE SERIAL_INT serial_interface.py <%%= serial_port %> <%%= serial_port %> 115200 NONE 1 10.0 nil
      BRIDGE <%%= bridge_name %>
  parameters:
    - name: Default Bridge Name
      required: false
      description: Bridge selected by default. Defaults to DEFAULT, the bridge every scope has.
      values: .+
VARIABLE_DISCOVERY:
  summary: Discover the possible values of a plugin variable from the host computer
  description: The VARIABLE_DISCOVERY keyword runs a Python discovery class on the host computer paired with
    COSMOS through openc3-app, using the bridge selected by VARIABLE_BRIDGE (or the DEFAULT bridge). The values it finds are added to the dropdown for the
    previously defined VARIABLE in the plugin installation dialog, after any VARIABLE_STATE options.
    Discovery runs when the dialog opens and can be refreshed. If openc3-app is not running the variable can
    still be typed in by hand. Discovery classes subclass openc3/discovery/discovery.py and implement discover().
    COSMOS provides openc3/discovery/serial_discovery.py (lists serial ports) and openc3/discovery/hid_discovery.py
    (lists the serial numbers of USB HID devices, optionally limited by Vendor ID and Product ID, and requires the hidapi package on the host).
    A variable can have multiple VARIABLE_DISCOVERY keywords and their results are combined. Each can be followed by
    VARIABLE_DISCOVERY_SET keywords that set other variables when a value it found is selected.
    Discovered values are claimed by the plugin that uses them. Once a plugin is installed, the value it chose
    for a VARIABLE_DISCOVERY variable (for example a serial port) is no longer offered to other plugins
    discovering with the same class on the same bridge, and the dialog notes which plugin is using it.
    The claim is released when the plugin is uninstalled. Upgrading or editing the plugin still offers the values it holds.
    Must follow a VARIABLE definition.
  since: 7.5.0
  example: |
    VARIABLE serial_port /dev/ttyUSB0
      VARIABLE_DISCOVERY openc3/discovery/serial_discovery.py
    VARIABLE controller_serial nil
      VARIABLE_STATE "First controller found" nil
      VARIABLE_DISCOVERY openc3.discovery.hid_discovery 0x054C 0x0CE6
  parameters:
    - name: Discovery Class Filename or Module
      required: true
      description: Python filename (e.g. openc3/discovery/serial_discovery.py) or module name
        (e.g. openc3.discovery.serial_discovery) of the discovery class, relative to the Python path on the host.
        The class is named after the file, e.g. SerialDiscovery.
      values: .+
    - name: Discovery Parameters
      required: false
      description: Additional parameters are passed to the discovery class constructor
      values: .+
VARIABLE_DISCOVERY_SET:
  summary: Set another plugin variable when a value found by this discovery is selected
  description: The VARIABLE_DISCOVERY_SET keyword applies to the previously defined VARIABLE_DISCOVERY.
    When the user selects a value in the plugin installation dialog that this discovery found, the named variable
    is set to the given value. This lets one variable configure others based on the kind of device found,
    for example the controller model. If several discoveries find the same value, the first one's sets apply.
    The user can still change the value afterwards. Multiple VARIABLE_DISCOVERY_SET keywords can be used.
    Must follow a VARIABLE_DISCOVERY definition.
  since: 7.5.0
  example: |
    VARIABLE dual_sense_version 5
      VARIABLE_STATE 5 5
      VARIABLE_STATE 4 4
    VARIABLE dual_sense_serial_num None
      VARIABLE_DISCOVERY openc3.discovery.hid_discovery 0x054C 0x05C4
        VARIABLE_DISCOVERY_SET dual_sense_version 4
      VARIABLE_DISCOVERY openc3.discovery.hid_discovery 0x054C 0x0CE6
        VARIABLE_DISCOVERY_SET dual_sense_version 5
  parameters:
    - name: Variable Name
      required: true
      description: Name of the variable to set when a value found by this discovery is selected
      values: .+
    - name: Value
      required: true
      description: Value to set the variable to
      values: .+
VARIABLE_STATE:
  summary: Add a selectable state for a plugin variable
  description: The VARIABLE_STATE keyword defines a selectable state for a previously defined VARIABLE.
    When states are defined for a variable, it renders as a dropdown/combobox in the plugin installation dialog instead of a text field.
    Users can still type custom values if needed. Multiple VARIABLE_STATE keywords can be used to define multiple states.
    Must follow a VARIABLE definition.
  since: 7.0.0
  example: |
    VARIABLE log_retain_time 172800
    VARIABLE_STATE "24 hours" 86400
    VARIABLE_STATE "48 hours" 172800
    VARIABLE_STATE 60 # Both description and value are set to 60
  parameters:
    - name: State Description
      required: false
      description: Human-readable description of what this state represents. Appears as option in the dropdown.
      values: .+
    - name: State Value
      required: true
      description: The value that will be used when this state is selected
      values: .+
VARIABLE_STATE_SHOW:
  summary: Show other plugin variables when this state is selected
  description: The VARIABLE_STATE_SHOW keyword applies to the previously defined VARIABLE_STATE.
    The listed variables are only displayed in the plugin installation dialog when this state is selected.
    Variables listed in any VARIABLE_STATE_SHOW of a variable are hidden unless the selected state lists them,
    or when the controlling variable is itself hidden. Variables never listed by a VARIABLE_STATE_SHOW are always shown. If a custom value is typed that doesn't match a state, all variables are shown.
    Hidden variables keep their current values and are still passed to the plugin.
    Multiple VARIABLE_STATE_SHOW keywords can be used and each can list multiple variables.
    Must follow a VARIABLE_STATE definition.
  since: 7.5.0
  example: |
    VARIABLE interface_type tcp
    VARIABLE_STATE "TCP/IP Client" tcp
      VARIABLE_STATE_SHOW hostname port
    VARIABLE_STATE "Serial" serial
      VARIABLE_STATE_SHOW serial_port baud_rate
    VARIABLE_STATE "Simulated" sim # hostname, port, serial_port, baud_rate all hidden
    VARIABLE hostname 127.0.0.1
    VARIABLE port 8080
    VARIABLE serial_port /dev/ttyUSB0
    VARIABLE baud_rate 115200
  parameters:
    - name: Variable Name
      required: true
      description: Name of a variable to show when this state is selected. Additional variable names can follow.
      values: .+
VARIABLE_STATE_SET:
  summary: Set the value of another plugin variable when this state is selected
  description: The VARIABLE_STATE_SET keyword applies to the previously defined VARIABLE_STATE.
    When this state is selected in the plugin installation dialog, the named variable is set to the given value.
    The user can still change the value afterwards. If the variable's new value selects a state that has its own
    VARIABLE_STATE_SET keywords, those are applied as well. The VARIABLE_STATE_SET values of the initially selected state are
    applied when the dialog opens, except for variables that already have a value from a previous install.
    Often used together with VARIABLE_STATE_SHOW. Must follow a VARIABLE_STATE definition.
  since: 7.5.0
  example: |
    VARIABLE interface_type tcp
    VARIABLE_STATE "TCP/IP Client" tcp
      VARIABLE_STATE_SHOW port
      VARIABLE_STATE_SET port 8080
    VARIABLE_STATE "Serial" serial
      VARIABLE_STATE_SHOW port baud_rate
      VARIABLE_STATE_SET port /dev/ttyUSB0
      VARIABLE_STATE_SET baud_rate 9600
    VARIABLE port 8080
    VARIABLE baud_rate 115200
  parameters:
    - name: Variable Name
      required: true
      description: Name of the variable to set when this state is selected
      values: .+
    - name: Value
      required: true
      description: Value to set the variable to
      values: .+
PLUGIN_TEXT_START:
  summary: Start a block of markdown text shown in the plugin installation dialog
  description: The PLUGIN_TEXT_START keyword begins a block of Markdown that is displayed at the top of the
    Variables tab in the plugin installation dialog. Use it to explain how to configure the plugin, for example
    which VARIABLE_STATE to choose for your hardware. All lines up to PLUGIN_TEXT_END are taken as-is
    (keywords, quotes and markdown headings are not processed as plugin.txt syntax) and the common leading indentation is removed.
    ERB is not evaluated in the text, but avoid ERB tags since the whole plugin.txt is still processed with ERB at install.
    Multiple PLUGIN_TEXT_START / PLUGIN_TEXT_END blocks are joined together.
  since: 7.5.0
  example: |
    PLUGIN_TEXT_START
      # Power Supply Plugin
      Supports both **TCP/IP** and **Serial** power supplies.
      1. Choose the `interface_type` for your hardware
      2. Fill in the connection settings that appear
    PLUGIN_TEXT_END
PLUGIN_TEXT_END:
  summary: Complete a block of markdown text started by PLUGIN_TEXT_START
  since: 7.5.0
NEEDS_DEPENDENCIES:
  summary: Indicates the plugin needs dependencies and sets the GEM_HOME environment variable
  description: If the plugin has a top level lib folder or lists runtime dependencies in the gemspec,
    NEEDS_DEPENDENCIES is effectively already set. Note that in Enterprise, having
    NEEDS_DEPENDENCIES adds the NFS volume mount to the Kubernetes pod.
  since: 5.5.0
INTERFACE:
  modifiers:
    <%= MetaConfigParser.load('interface_modifiers.yaml').to_meta_config_yaml(4) %>
  summary: Defines a connection to a physical target
  description: Interfaces are what OpenC3 uses to talk to a particular piece
    of hardware. Interfaces require a Ruby or Python file which implements all the interface
    methods necessary to talk to the hardware. OpenC3 defines many built in interfaces
    or you can define your own as long as it implements the interface protocol.
  parameters:
    - name: Interface Name
      required: true
      description: Name of the interface. This name will appear in the
        Interfaces tab of the Server and is also referenced by other keywords.
        The OpenC3 convention is to name interfaces after their targets with
        '_INT' appended to the name, e.g. INST_INT for the INST target.
      values: \D\S*
    - name: Filename
      required: true
      description: Ruby or Python file to use when instantiating the interface.
      values:
        <%= MetaConfigParser.load('_interfaces.yaml').to_meta_config_yaml(8) %>
      documentation: Additional parameters are required. Please see the [Interfaces](../configuration/interfaces.md)
        documentation for more details.
ROUTER:
  modifiers:
    <%= MetaConfigParser.load('interface_modifiers.yaml').to_meta_config_yaml(4) %>
  summary: Create router to receive commands and output telemetry packets from one or more interfaces
  description: Creates an router which receives command packets from
    their remote clients and sends them to associated interfaces. They receive telemetry
    packets from their interfaces and send them to their remote clients. This allows
    routers to be intermediaries between an external client and an actual device.
  parameters:
    - name: Name
      required: true
      description: Name of the router
      values: .+
    - name: Filename
      required: true
      description: Ruby or Python file to use when instantiating the interface.
      values:
        <%= MetaConfigParser.load('_interfaces.yaml').to_meta_config_yaml(8) %>
      documentation: Additional parameters are required. Please see the [Interfaces](../configuration/interfaces.md)
        documentation for more details.
<%= MetaConfigParser.load('target.yaml').to_meta_config_yaml() %>
<%= MetaConfigParser.load('microservice.yaml').to_meta_config_yaml() %>
<%= MetaConfigParser.load('tool.yaml').to_meta_config_yaml() %>
WIDGET:
  summary: Define a custom widget
  example: WIDGET HELLOWORLD
  description: Defines a custom widget that can be used in Telemetry Viewer screens.
  parameters:
    - name: Widget Name
      description: The name of the widget will be used to build a path to the widget implementation. For example, `WIDGET HELLOWORLD` will find the as-built file tools/widgets/HelloworldWidget/HelloworldWidget.umd.min.js. See the [Custom Widgets](../guides/custom-widgets.md)
        guide for more details.
      required: true
      values: .+
    - name: Label
      description: The label for the widget that will appear in the Data Viewer component drop down
      required: false
      values: .+
  modifiers:
    DISABLE_ERB:
      summary: Disable ERB processing
      description: Disable ERB processing for the entire widget or a set of regular expressions over its filenames
      since: 5.12.0
      parameters:
        - name: Regex
          required: false
          description: Regex to match against filenames. If match, then no ERB processing
          values: .+
SCRIPT_ENGINE:
  summary: Define a script engine to add language support to Script Runner
  example: SCRIPT_ENGINE .print print_script_engine.py
  description: Defines a script engine to add language support to Script Runner. For a realistic example, see our [CSTOL](https://github.com/OpenC3/openc3-cosmos-script-engine-cstol) plugin.
  since: 6.5.0
  parameters:
    - name: Extension
      description: Extension that will use this script engine
      required: true
      values: .+
    - name: Script Engine Filename
      description: Filename that implements the script engine. Should be in top level lib folder in plugin.
      required: true
      values: .+