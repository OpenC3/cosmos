---
TELEMETRY:
  # Prevent prettier from removing the newline after modifiers:
  # prettier-ignore
  modifiers:
    <%= MetaConfigParser.load('telemetry_modifiers.yaml').to_meta_config_yaml(4) %>
  summary: Defines a new telemetry packet
  parameters:
    - name: Target
      required: true
      description: Name of the target this telemetry packet is associated with
      values: .+
    - name: Packet
      required: true
      description:
        Name of this telemetry packet. Also referred to as its mnemonic.
        Must be unique to telemetry packets in this target. Ideally will be as short and clear as possible.
      values: \D\S*
    - name: Endianness
      required: true
      description: Indicates if the data in this packet is in Big Endian or Little Endian format
      values: ["BIG_ENDIAN", "LITTLE_ENDIAN"]
    - name: Description
      required: false
      description: Description of this telemetry packet which must be enclosed with quotes
      values: '[''"].*[''"]'
  example: TELEMETRY INST HEALTH_STATUS BIG_ENDIAN "Instrument health and status"
SELECT_TELEMETRY:
  # prettier-ignore
  modifiers:
    <%= MetaConfigParser.load('telemetry_modifiers.yaml').to_meta_config_yaml(4) %>
  summary: Selects an existing telemetry packet for editing
  description:
    Typically used in a separate configuration file from where the original
    telemetry is defined to override or add to the existing telemetry definition.
    Must be used in conjunction with SELECT_ITEM to change an individual item.
  parameters:
    - name: Target Name
      required: true
      description: Name of the target this telemetry packet is associated with
      values: .+
    - name: Packet Name
      required: true
      description: Name of the telemetry packet to select
      values: .+
  example: |
    SELECT_TELEMETRY INST HEALTH_STATUS
      SELECT_ITEM TEMP1
        # Define limits for this item, overrides or replaces any existing
        LIMITS DEFAULT 3 ENABLED -90.0 -80.0 80.0 90.0 -20.0 20.0
LIMITS_GROUP:
  summary: Defines a group of related limits Items
  description:
    Limits groups contain telemetry items that can be enabled and disabled together.
    It can be used to group related limits as a subsystem that can be enabled or disabled
    as that particular subsystem is powered (for example). To enable a group call the
    enable_limits_group("NAME") method in Script Runner. To disable a group call the
    disable_limits_group("NAME") in Script Runner. Items can belong to multiple groups
    but the last enabled or disabled group "wins". For example, if an item belongs to
    GROUP1 and GROUP2 and you first enable GROUP1 and then disable GROUP2 the item will
    be disabled. If you then enable GROUP1 again it will be enabled.


    Each limits group is also published as telemetry in the LIMITS_GROUP packet of the
    target which defines the group. For a group named THERMAL defined by the INST target,
    INST LIMITS_GROUP THERMAL is the most severe limits state (GREEN, YELLOW or RED) of the
    group's members which have limits enabled, so it can be displayed on screens, graphed,
    used in scripts with tlm and wait_check, and extracted from history.
    INST LIMITS_GROUP THERMAL_ENABLED is TRUE when limits are enabled on every member. A
    group with no enabled members is GREEN with no limits color. A target which defines
    limits groups can't also define its own LIMITS_GROUP telemetry packet.


    Group names become item names so they follow the same rules as ITEM names
    (no spaces, quotes, double underscores or trailing underscore). They can't end
    in _ENABLED, use a reserved item name like RECEIVED_COUNT, or be longer than 119
    characters. Group names only need to be unique within a target, so two targets
    can each define a THERMAL group, but two groups in a target can't differ only by
    characters the time-series database replaces with an underscore (like TEMP.A and TEMP_A).
  parameters:
    - name: Group Name
      required: true
      description: Name of the limits group
      values: .+
LIMITS_GROUP_ITEM:
  summary: Adds the specified telemetry item to the last defined LIMITS_GROUP
  description:
    Limits group information is typically kept in a separate configuration
    file in the config/TARGET/cmd_tlm folder named limits_groups.txt.


    Pass a single group name instead of a telemetry item to nest another group
    defined by the same target. The parent then rolls up the child's state, and
    enabling or disabling the parent enables or disables every item below it. The
    nested group is stored as the item which carries the child's state, so in the
    INST target LIMITS_GROUP_ITEM THERMAL is the same as
    LIMITS_GROUP_ITEM INST LIMITS_GROUP THERMAL. Use that full form to nest a group
    defined by another target. A child group can be installed after its parent.
    Nested groups can't form a loop, so a group can't contain itself directly or
    through other groups.
  parameters:
    - name: Target Name or Group Name
      required: true
      description: Name of the target, or the name of a limits group of this target to nest when it's the only parameter
      values: .+
    - name: Packet Name
      required: false
      description: Name of the packet. Required when adding a telemetry item.
      values: .+
    - name: Item Name
      required: false
      description: Name of the telemetry item to add to the group. Required when adding a telemetry item.
      values: .+
  example: |
    LIMITS_GROUP THERMAL
      LIMITS_GROUP_ITEM INST HEALTH_STATUS TEMP1
      LIMITS_GROUP_ITEM INST HEALTH_STATUS TEMP2
      LIMITS_GROUP_ITEM INST HEALTH_STATUS TEMP3
    LIMITS_GROUP SPACECRAFT
      LIMITS_GROUP_ITEM THERMAL
      LIMITS_GROUP_ITEM INST2 LIMITS_GROUP POWER
      LIMITS_GROUP_ITEM INST HEALTH_STATUS VOLTS
