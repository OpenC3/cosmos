---
TELEMETRY:
  # Prevent prettier from removing the newline after modifiers:
  # prettier-ignore
  modifiers:
    <%= MetaConfigParser.load('telemetry_modifiers.yaml').to_meta_config_yaml(4) %>
  summary: Defines a new telemetry packet
  parameters:
    - name: Target
      required: true
      description: Name of the target this telemetry packet is associated with
      values: .+
    - name: Packet
      required: true
      description:
        Name of this telemetry packet. Also referred to as its mnemonic.
        Must be unique to telemetry packets in this target. Ideally will be as short and clear as possible.
      values: \D\S*
    - name: Endianness
      required: true
      description: Indicates if the data in this packet is in Big Endian or Little Endian format
      values: ["BIG_ENDIAN", "LITTLE_ENDIAN"]
    - name: Description
      required: false
      description: Description of this telemetry packet which must be enclosed with quotes
      values: '[''"].*[''"]'
  example: TELEMETRY INST HEALTH_STATUS BIG_ENDIAN "Instrument health and status"
SELECT_TELEMETRY:
  # prettier-ignore
  modifiers:
    <%= MetaConfigParser.load('telemetry_modifiers.yaml').to_meta_config_yaml(4) %>
  summary: Selects an existing telemetry packet for editing
  description:
    Typically used in a separate configuration file from where the original
    telemetry is defined to override or add to the existing telemetry definition.
    Must be used in conjunction with SELECT_ITEM to change an individual item.
  parameters:
    - name: Target Name
      required: true
      description: Name of the target this telemetry packet is associated with
      values: .+
    - name: Packet Name
      required: true
      description: Name of the telemetry packet to select
      values: .+
  example: |
    SELECT_TELEMETRY INST HEALTH_STATUS
      SELECT_ITEM TEMP1
        # Define limits for this item, overrides or replaces any existing
        LIMITS DEFAULT 3 ENABLED -90.0 -80.0 80.0 90.0 -20.0 20.0
LIMITS_GROUP:
  summary: Defines a group of related limits Items
  description:
    Limits groups contain telemetry items that can be enabled and disabled together.
    It can be used to group related limits as a subsystem that can be enabled or disabled
    as that particular subsystem is powered (for example). To enable a group call the
    enable_limits_group("NAME") method in Script Runner. To disable a group call the
    disable_limits_group("NAME") in Script Runner. Items can belong to multiple groups
    but the last enabled or disabled group "wins". For example, if an item belongs to
    GROUP1 and GROUP2 and you first enable GROUP1 and then disable GROUP2 the item will
    be disabled. If you then enable GROUP1 again it will be enabled.


    Each limits group is also published as telemetry in the LIMITS_GROUP packet of the
    target which defines the group. For a group named THERMAL defined by the INST target,
    INST LIMITS_GROUP THERMAL is the most severe limits state (GREEN, YELLOW or RED) of the
    group's members which have limits enabled, so it can be displayed on screens, graphed,
    used in scripts with tlm and wait_check, and extracted from history. It's BLUE only
    when every member which counts is BLUE, and DISABLED when limits are disabled on every
    member. INST LIMITS_GROUP THERMAL_ENABLED is TRUE when limits are enabled on every
    member, FALSE when they're disabled on every member, and PARTIAL otherwise, for example
    when a nested group is disabled. A group whose enabled members have no limits state yet
    is GREEN with no limits color. The LIMITS_GROUP packet
    name is reserved for targets which define limits groups. If such a target also defines
    its own LIMITS_GROUP telemetry packet, COSMOS keeps that packet and logs a warning, and
    the target's groups can still be enabled and disabled but aren't published as
    telemetry until the packet is renamed and the target reinstalled.


    Group names become item names so they follow the same rules as ITEM names
    (no spaces, quotes, double underscores or trailing underscore). They also become
    time-series database columns so they can't contain characters the database
    replaces with an underscore, like the period in TEMP.A. They can't end in _ENABLED,
    use a reserved item name like RECEIVED_COUNT or PACKET_TIME, or be longer than 119
    characters. A group whose name breaks these rules is skipped with a warning, along
    with its LIMITS_GROUP_ITEM and NESTED_LIMITS_GROUP lines, and a NESTED_LIMITS_GROUP
    with such a name is skipped the same way. Group names only need to be unique within
    a target, so two targets can each define a THERMAL group.
  parameters:
    - name: Group Name
      required: true
      description: Name of the limits group
      values: .+
LIMITS_GROUP_ITEM:
  summary: Adds the specified telemetry item to the last defined LIMITS_GROUP
  description:
    Limits group information is typically kept in a separate configuration
    file in the config/TARGET/cmd_tlm folder named limits_groups.txt. Use
    NESTED_LIMITS_GROUP to add another limits group. A LIMITS_GROUP_ITEM in a
    packet named LIMITS_GROUP is skipped with a warning since that packet holds
    the rolled up state of limits groups.
  parameters:
    - name: Target Name
      required: true
      description: Name of the target
      values: .+
    - name: Packet Name
      required: true
      description: Name of the packet
      values: .+
    - name: Item Name
      required: true
      description: Name of the telemetry item to add to the group
      values: .+
  example: |
    LIMITS_GROUP THERMAL
      LIMITS_GROUP_ITEM INST HEALTH_STATUS TEMP1
      LIMITS_GROUP_ITEM INST HEALTH_STATUS TEMP2
      LIMITS_GROUP_ITEM INST HEALTH_STATUS TEMP3
NESTED_LIMITS_GROUP:
  summary: Nests the specified limits group in the last defined LIMITS_GROUP
  description:
    The parent group rolls up the nested group's state. Enabling or disabling the
    parent enables or disables every group and item below it unless the API is
    called with cascade false, which only changes the parent itself and the items
    directly in it. A group disabled this way is DISABLED and its parents ignore it
    while its nested groups keep checking limits and rolling up their own state. Pass just
    the group name to nest a group defined by the same target, or the target name
    and group name to nest a group defined by another target. A nested group can be
    installed after its parent and is ignored until it is.
    Nested groups can't form a loop, so a group can't contain itself directly or
    through other groups. Installing a target skips the NESTED_LIMITS_GROUP which
    would close a loop and logs a warning.
  parameters:
    - name: Target Name or Group Name
      required: true
      description: Name of the target which defines the group, or the name of a limits group of this target when it's the only parameter
      values: .+
    - name: Group Name
      required: false
      description: Name of the limits group. Required when the first parameter is a target name.
      values: .+
  example: |
    LIMITS_GROUP SPACECRAFT
      NESTED_LIMITS_GROUP THERMAL
      NESTED_LIMITS_GROUP INST2 POWER
      LIMITS_GROUP_ITEM INST HEALTH_STATUS VOLTS
