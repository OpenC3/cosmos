[project]
name = "<%= plugin_name %>"
version = "0.0.0"
description = "OpenC3 <%= plugin_name %> plugin Python dependencies"
readme = "README.md"
requires-python = ">=3.11"
# Add your plugin's Python dependencies here, then run `uv lock` and commit the
# resulting uv.lock so COSMOS installs the same versions every time.
dependencies = []

[dependency-groups]
# Development and test only. COSMOS installs plugin dependencies with --no-dev,
# so nothing here reaches a deployed plugin. Left unpinned on purpose: a bound
# written into this template would still be here whenever you generated this
# plugin, holding you on stale tooling. Commit the uv.lock for reproducible
# versions, and add a pin here only if you need a specific one.
dev = [
    "openc3",
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
# This file declares dependencies only — it is not a buildable package. COSMOS
# loads plugin code from lib/ at runtime and installs with `uv sync --frozen`,
# so nothing here is ever built and no [build-system] is needed.
package = false

# Keep the dev group out of a plain `uv sync` so a local install matches what
# COSMOS installs (it passes --no-dev). Use `uv sync --group dev` while
# developing, or `uv run --group dev pytest`.
default-groups = []

# Uncomment to install dependencies from a private PyPI repository.
# See: https://docs.astral.sh/uv/configuration/indexes/
#
# These settings are used whenever uv resolves: when you run `uv lock`, and at
# install time when no uv.lock is committed alongside this file. With the
# uv.lock committed, COSMOS installs with `uv sync --frozen`, which fetches the
# exact registry and wheel URLs recorded in the lock — so a locked plugin is not
# redirected by the PyPI URL in Admin Console -> Settings. Without a uv.lock,
# that setting is passed as uv's --default-index and overrides the default index
# configured here.
#
# Indexes are searched in the order listed, before the default index. Mark one
# `default = true` to replace public PyPI entirely, or list your private repo
# first and leave PyPI as the default to fall back to it.
#
# index = [
#     { name = "private", url = "https://private-pypi.example.com/simple" },
#     { name = "pypi", url = "https://pypi.org/simple", default = true },
# ]
#
# Pin internal packages to a specific index. A pin is not overridden by the
# Admin Console setting, and it prevents a same-named package on public PyPI
# from being substituted. Add `explicit = true` to an index to keep it from
# serving anything other than packages pinned to it.
#
# sources = { my-internal-pkg = { index = "private" } }
#
# Uncomment for self-signed certificates.
#
# allow-insecure-host = ["private-pypi.example.com"]

[tool.ty.environment]
# COSMOS puts the plugin's lib/ on sys.path at runtime rather than installing it,
# so ty needs it here to resolve imports between the plugin's own modules.
extra-paths = ["lib"]

[tool.ty.rules]
# These are artifacts of how COSMOS ships its Python API, not mistakes in your
# plugin, so they are off rather than "warn": ty exits non-zero on a warning, so
# "warn" would fail the check just as an error does. Delete a line to opt back
# in, or silence a single case with `# ty: ignore[rule-name]`.
#
# openc3.script re-exports its API through star imports (from .telemetry import *,
# etc.) with no __all__, so ty cannot see tlm, cmd, send_raw and friends even
# though they resolve at runtime. unresolved-reference covers using such a name,
# unresolved-import covers importing one by name. Ruff's F405 flags the same
# thing if you want it reported.
unresolved-reference = "ignore"
unresolved-import = "ignore"
# Script Runner replaces openc3.script.start() at runtime with its own
# implementation, which accepts bind_variables. The pip package only ships the
# stub signature start(procedure_name).
unknown-argument = "ignore"

[tool.ruff]
line-length = 120
# target-version is intentionally absent: ruff infers it from the project's
# requires-python above, so there is one place to bump the minimum. ty does the
# same, which is why [tool.ty.environment] sets no python-version either.

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W", "C4", "SIM"]
ignore = [
    "E402",   # Module level import not at top of file
    "E501",   # Line too long (handled by the formatter)
    "F402",   # Import shadowed by loop var
    "F403",   # Star imports used - the documented way to import the COSMOS API
    "F405",   # Name may be undefined due to star import
    "N815",   # Mixed case variable in class scope
]

[tool.ruff.lint.isort]
known-first-party = ["openc3"]
lines-after-imports = 2
