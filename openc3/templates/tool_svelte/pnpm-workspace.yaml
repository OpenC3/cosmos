# smui-theme builds its sass load path from require.resolve('@material/dom'),
# which only finds the sibling @material/* packages in a flat node_modules.
nodeLinker: hoisted

minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeExclude:
  # we control these packages, so we don't need to wait to consume them
  - '@openc3/js-common'
  - '@openc3/vue-common'
